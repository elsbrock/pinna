syntax = "proto3";

package pinna.v1;

// Control API of pinnad, without authentication. Served on 127.0.0.1:7470 for
// pinnactl, and with the dashboard on the LAN (`[web]`, ADR 0005): anyone who can
// reach either listener can control the device.
service DeviceService {
  // Current state of the device.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Set the speaker volume.
  rpc SetVolume(SetVolumeRequest) returns (SetVolumeResponse);
  // Set the volume of live streams: the sender volume of the AirPlay and
  // Bluetooth bridges (ADR 0011). Accepted only from the device itself.
  rpc SetStreamVolume(SetStreamVolumeRequest) returns (SetStreamVolumeResponse);
  // Set the track a bridge's live stream plays, under the source name its
  // stream header gives (ADR 0011). Accepted only from the device itself.
  rpc SetStreamMetadata(SetStreamMetadataRequest) returns (SetStreamMetadataResponse);
  // Set the software microphone mute (the hardware latch is read-only).
  rpc SetMute(SetMuteRequest) returns (SetMuteResponse);
  // Start a voice conversation, like pressing the action button.
  rpc StartConversation(StartConversationRequest) returns (StartConversationResponse);
  // Stop the current conversation, announcement or timer alarm.
  rpc StopConversation(StopConversationRequest) returns (StopConversationResponse);
  // Run a short LED animation cycle.
  rpc LedTest(LedTestRequest) returns (LedTestResponse);
  // Clear a pending notification, like pressing the action button while the
  // ring shows it: Home Assistant sees the switch turn off and a `cleared` event.
  rpc ClearNotification(ClearNotificationRequest) returns (ClearNotificationResponse);
  // Current state, then again on every change.
  rpc WatchStatus(WatchStatusRequest) returns (stream WatchStatusResponse);
  // The LED ring as the satellite shows it: the current frame, then the
  // latest one at most 25 times a second while it changes.
  rpc WatchRing(WatchRingRequest) returns (stream WatchRingResponse);
  // Change settings; the same as changing them in Home Assistant. Fails when
  // the satellite can't save them, so a restart would undo them.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // The time zones UpdateSettings accepts.
  rpc ListTimeZones(ListTimeZonesRequest) returns (ListTimeZonesResponse);
  // The other satellites on the network (ADR 0021), as pinnad's background
  // search last found them. Returns at once: it sends no query.
  rpc ListSatellites(ListSatellitesRequest) returns (ListSatellitesResponse);
  // Start tuning the wake word sensitivity with the satellite's + and −
  // buttons. Fails while the microphones are muted, the wake word is off, or
  // a request or timer alarm is active.
  rpc StartCalibration(StartCalibrationRequest) returns (StartCalibrationResponse);
  // Stop it, keeping the sensitivity as it is; UpdateSettings undoes a change.
  rpc StopCalibration(StopCalibrationRequest) returns (StopCalibrationResponse);
  // Network interfaces, addresses and Wi-Fi link.
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse);
  // pinnad's recent log lines, then new ones as they are written.
  rpc WatchLogs(WatchLogsRequest) returns (stream WatchLogsResponse);
  // The A/B slots and the running version.
  rpc GetUpdates(GetUpdatesRequest) returns (GetUpdatesResponse);
  // Start installing a release into the inactive slot (`pinnactl update`).
  // pinnad runs the install; it goes on when the caller goes away.
  rpc InstallUpdate(InstallUpdateRequest) returns (InstallUpdateResponse);
  // Progress of the running (or last) install: its lines so far, then new ones,
  // ending after the line marked done.
  rpc WatchInstall(WatchInstallRequest) returns (stream WatchInstallResponse);
  // Choose the slot that boots next. The other slot: its image is checked as
  // pinna-init checks it, it becomes active as a trial (ADR 0003) and the
  // satellite restarts; if the restart fails, the slot state is put back.
  // Only a slot that is good or hasn't been started yet. The running slot: it
  // boots next again, which cancels a pending update; no restart. Refused
  // while an install runs or the running slot is on trial.
  rpc SetActiveSlot(SetActiveSlotRequest) returns (SetActiveSlotResponse);
  // Restart the satellite.
  rpc Reboot(RebootRequest) returns (RebootResponse);
  // Forget everything set on this satellite and restart it as it was
  // installed (ADR 0010): settings, Wi-Fi networks, the Home Assistant
  // encryption key, SSH keys added on it, its SSH host key. The log stays.
  rpc FactoryReset(FactoryResetRequest) returns (FactoryResetResponse);
  // Wi-Fi networks in range, from a fresh scan (a few seconds; ADR 0008).
  rpc ScanWifi(ScanWifiRequest) returns (ScanWifiResponse);
  // The saved networks, whether a join runs, and how the last one ended.
  rpc ListWifi(ListWifiRequest) returns (ListWifiResponse);
  // Try a network: back to the previous one unless it gives an address
  // within 45 s. Streams the steps, ending with TRIAL or FAILED; the join
  // goes on when the caller goes away. One at a time.
  rpc JoinWifi(JoinWifiRequest) returns (stream JoinWifiResponse);
  // Keep the network on trial (save it), or go back now. Opening the
  // dashboard at the trial's address keeps it too.
  rpc KeepWifi(KeepWifiRequest) returns (KeepWifiResponse);
  // Forget a saved network. Forgetting the one in use disconnects.
  rpc ForgetWifi(ForgetWifiRequest) returns (ForgetWifiResponse);
  // Let phones pair over Bluetooth for two minutes (ADR 0011): the satellite
  // is discoverable, and the window closes when a phone pairs. Fails unless
  // Bluetooth is on and ready.
  rpc StartBluetoothPairing(StartBluetoothPairingRequest) returns (StartBluetoothPairingResponse);
  // Close the pairing window early.
  rpc StopBluetoothPairing(StopBluetoothPairingRequest) returns (StopBluetoothPairingResponse);
  // Forget a paired phone: it has to pair again to play.
  rpc ForgetBluetoothDevice(ForgetBluetoothDeviceRequest) returns (ForgetBluetoothDeviceResponse);
  // The Bluetooth bridge reports the adapter and the paired phones. Accepted
  // only from the device itself.
  rpc ReportBluetooth(ReportBluetoothRequest) returns (ReportBluetoothResponse);
  // Change the ring light, like Home Assistant's "LED ring" light.
  rpc SetRingLight(SetRingLightRequest) returns (SetRingLightResponse);
  // Resume, pause, stop, mute or unmute the media player, like Home
  // Assistant's media player controls.
  rpc ControlMedia(ControlMediaRequest) returns (ControlMediaResponse);
  // Play a URL on the media player, like Home Assistant's "Play media".
  rpc PlayMedia(PlayMediaRequest) returns (PlayMediaResponse);
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_IDLE = 1;
  PHASE_LISTENING = 2;
  PHASE_THINKING = 3;
  PHASE_SPEAKING = 4;
}

message Timer {
  string id = 1;
  string name = 2;
  uint32 seconds_left = 3;
  uint32 total_seconds = 4;
  bool active = 5;
}

message WakeWord {
  // The active words' phrases for display, e.g. "Alexa" or "Alexa or Hey
  // Jarvis"; empty when none is active.
  string phrase = 1;
  // Wake word detection is currently armed (idle, unmuted, voice subscribed).
  bool enabled = 2;
  // The score a wake needs at the current sensitivity, 0..1.
  float threshold = 3;
  // Wakes and near misses while detection was armed, since pinnad started:
  // oldest first, at most 20.
  repeated WakeEvent recent = 4;
  // Tuning with the satellite's buttons, while it runs.
  Calibration calibration = 5;
  // Every word the satellite can listen for (ADR 0013).
  repeated WakeWordOption available = 6;
}

message WakeWordOption {
  // Stable id, as Home Assistant knows it (e.g. "alexa_v0.1").
  string id = 1;
  // What to say, e.g. "Alexa".
  string phrase = 2;
}

// A list of wake word ids, so that UpdateSettingsRequest can tell "unchanged"
// from "none".
message WakeWordIds {
  repeated string ids = 1;
}

// Sensitivity calibration from the satellite's + and − buttons, started from
// the dashboard or Home Assistant. The buttons are volume buttons outside one.
message Calibration {
  // The sensitivity when calibration started, which Undo restores.
  uint32 started_from = 1;
  // What happened so far, oldest first, at most 10.
  repeated CalibrationEvent events = 2;
}

message CalibrationEvent {
  // Counts up from 1 within a calibration.
  uint32 id = 1;
  CalibrationEventKind kind = 2;
  // The + (raise) or − button; false for a wake.
  bool raise = 3;
  // The wake's or near miss's score, when the press referred to one.
  optional float score = 4;
  // Sensitivity before and after; equal for an event that changed nothing.
  uint32 from = 5;
  uint32 to = 6;
}

enum CalibrationEventKind {
  CALIBRATION_EVENT_KIND_UNSPECIFIED = 0;
  // The detector woke; no request started.
  CALIBRATION_EVENT_KIND_WOKE = 1;
  // + raised the sensitivity, to catch a near miss.
  CALIBRATION_EVENT_KIND_RAISED = 2;
  // − lowered it, to ignore a false wake.
  CALIBRATION_EVENT_KIND_LOWERED = 3;
  // A press with nothing heard in the feedback window.
  CALIBRATION_EVENT_KIND_NOTHING_HEARD = 4;
  // A press no setting can fix: a near miss below what 100 catches, or one that
  // reached the threshold and was rejected for another reason (+); a wake
  // every setting accepts (−).
  CALIBRATION_EVENT_KIND_NO_SETTING_HELPS = 5;
  // Refused: the change would undo a press the other way, because the real wake
  // and the false one score about the same here.
  CALIBRATION_EVENT_KIND_WOULD_UNDO = 6;
}

// A wake, or a near miss: speech that scored at least 0.20 without waking the
// satellite.
message WakeEvent {
  // Milliseconds since the Unix epoch.
  uint64 unix_ms = 1;
  bool woke = 2;
  // The detector's peak score, 0..1.
  float score = 3;
  // The lowest sensitivity at which this score wakes the satellite; unset when
  // even 100 doesn't.
  optional uint32 wakes_from = 4;
  // A near miss whose score reached the threshold, rejected by the detector's
  // other rules (too quiet against the background noise, or too short). The
  // sensitivity doesn't change that.
  bool reached_threshold = 5;
  // The phrase of the wake word that woke it; empty for a near miss. Home
  // Assistant's "Last wake word" shows it too when the wake starts a request,
  // not when it stops an alarm or calibration takes it.
  string phrase = 6;
}

message Status {
  string version = 1;
  // ESPHome node name, which is also the hostname (ADR 0010).
  string name = 2;
  string mac = 3;
  uint64 uptime_seconds = 4;
  Phase phase = 5;
  // Muted by either source.
  bool muted = 6;
  bool hardware_muted = 7;
  bool software_muted = 8;
  // Logical volume 0..=100.
  uint32 volume = 9;
  // Home Assistant is connected to the ESPHome API.
  bool ha_connected = 10;
  // Home Assistant subscribed to voice assistant runs.
  bool voice_subscribed = 11;
  WakeWord wake_word = 12;
  repeated Timer timers = 13;
  // Resolved audio backend ("echodot", "echodot-pipewire", "pipewire", "wav",
  // "none").
  string audio_backend = 14;
  // LED backend ("is31", "mock", "virtual", "none").
  string led_backend = 15;
  // A finished timer's alarm is sounding; StopConversation silences it.
  bool alarm_ringing = 16;
  Settings settings = 17;
  // Which hardware this is, as a stable id for the dashboard's drawing:
  // "echo-dot-2" for the Echo Dot (2nd gen), "echo-2" for the Echo
  // (2nd gen); empty when unknown (QEMU, a PC).
  string model = 18;
  // A notification is pending (Home Assistant's "Notification" switch); the ring
  // pulses while idle. ClearNotification clears it.
  bool notification = 19;
  // A virtual Echo Dot in the development VM (ADR 0014): its microphone,
  // speaker, buttons and microphone switch are on the /virtual-device socket.
  bool virtual_device = 20;
  // How the boot before this one ended, from pstore (ADR 0012).
  LastBoot last_boot = 21;
  // The ESPHome API to Home Assistant is encrypted (Noise).
  bool api_encrypted = 22;
  // The image carries the key (a builder's `secrets/device/esphome-key` or
  // `[esphome] encryption_key`): a factory reset keeps it (ADR 0018).
  bool api_key_from_image = 23;
  // The ring runs its test pattern (LedTest, the dashboard's Identify): one
  // second each of listening, thinking, speaking and muted, above everything else.
  bool led_test = 24;
  // The AirPlay receiver as it is, not only as switched (ADR 0011).
  AirPlay airplay = 25;
  // Bluetooth as it runs, not only as switched (ADR 0011).
  Bluetooth bluetooth = 26;
  // The ring as a light (Home Assistant's "LED ring" light).
  RingLight ring_light = 27;
  // The media player (Home Assistant's "Media player").
  Media media = 28;
}

enum MediaState {
  MEDIA_STATE_UNSPECIFIED = 0;
  MEDIA_STATE_IDLE = 1;
  // Playing, or waiting for the stream's data.
  MEDIA_STATE_PLAYING = 2;
  MEDIA_STATE_PAUSED = 3;
  // An announcement plays; the music waits under it.
  MEDIA_STATE_ANNOUNCING = 4;
}

// Music on the media lane, from Home Assistant, AirPlay, Bluetooth or
// PlayMedia, and Home Assistant's announcements.
message Media {
  MediaState state = 1;
  // What plays, or the play that is opening while nothing plays; empty for
  // AirPlay and Bluetooth.
  string url = 2;
  // AirPlay or Bluetooth plays. Pausing ends their session, like stopping.
  bool stream = 3;
  // The music is muted (not the microphones), until unmuted.
  bool muted = 4;
  // Why the last media ended badly, or why a play failed to open; cleared
  // by the next play or a stop. A play that fails to open leaves what
  // played before playing (ADR 0011).
  string error = 5;
  // The satellite has a working speaker: without one, nothing plays.
  bool available = 6;
  // 0..=100: the stream's own volume while AirPlay or Bluetooth plays,
  // Volume otherwise.
  uint32 volume = 7;
  // What plays, as its source names it (ADR 0011): the bridge's track, or a
  // URL's tags or radio title. Empty when the source doesn't say, and while
  // nothing plays.
  string title = 8;
  string artist = 9;
  string album = 10;
  // An internet radio station's name, from its ICY metadata.
  string station = 11;
  // While a stream plays: the source its header names, `airplay` or
  // `bluetooth`.
  string source = 12;
  // With `error`: the URL that failed. `url` is what still plays, if anything.
  string error_url = 13;
}

// The ring as a light. The ring shows it while idle, below a running timer and
// a notification and above music. It starts off when the satellite starts.
message RingLight {
  bool on = 1;
  // 0..=100, under the LED brightness setting.
  uint32 brightness = 2;
  // 0xRRGGBB.
  uint32 rgb = 3;
  // One of `effects`.
  string effect = 4;
  repeated string effects = 5;
}

message Bluetooth {
  BluetoothState state = 1;
  // The name phones list it under, while it is on.
  string name = 2;
  // The controller's address, while it is on.
  string address = 3;
  // While the pairing window is open: when it closes, in Unix milliseconds.
  // 0 when it is closed.
  uint64 pairing_until_ms = 4;
  // The paired phones, while it is ready.
  repeated BluetoothDevice devices = 5;
  // Why it failed, or why it is unavailable.
  string reason = 6;
  // pairing_until_ms as seconds left when this Status was sent: count down
  // from when it arrived, whatever the clocks say.
  uint32 pairing_seconds_left = 7;
}

message BluetoothDevice {
  // Like "68:37:E9:41:FF:4F".
  string address = 1;
  string name = 2;
  bool connected = 3;
}

enum BluetoothState {
  BLUETOOTH_STATE_UNSPECIFIED = 0;
  BLUETOOTH_STATE_OFF = 1;
  // Switched on; the adapter isn't ready yet.
  BLUETOOTH_STATE_STARTING = 2;
  BLUETOOTH_STATE_READY = 3;
  BLUETOOTH_STATE_FAILED = 4;
  // No Bluetooth adapter or no working speaker: the switch is refused.
  BLUETOOTH_STATE_UNAVAILABLE = 5;
}

message AirPlay {
  AirPlayState state = 1;
  // The name senders list it under, while it is on.
  string name = 2;
  // Why it failed: systemd's result for the bridge, e.g. "exit-code".
  string reason = 3;
}

enum AirPlayState {
  AIRPLAY_STATE_UNSPECIFIED = 0;
  AIRPLAY_STATE_OFF = 1;
  // Switched on; the receiver isn't running yet.
  AIRPLAY_STATE_STARTING = 2;
  AIRPLAY_STATE_READY = 3;
  AIRPLAY_STATE_FAILED = 4;
  // No working speaker: the switch is refused.
  AIRPLAY_STATE_UNAVAILABLE = 5;
}

// How the previous boot ended, as pinnad read it back from the pstore records
// of the boot before this one.
enum LastBootOutcome {
  LAST_BOOT_OUTCOME_UNSPECIFIED = 0;
  // No records: this is the first start, or the power was lost.
  LAST_BOOT_OUTCOME_COLD_START = 1;
  // A recorded, clean restart; `reason` says why ("update", "user", ...).
  LAST_BOOT_OUTCOME_RESTARTED = 2;
  // The boot ended in rescue mode; `reason` says why ("no-root", ...).
  LAST_BOOT_OUTCOME_RESCUE = 3;
  // A kernel panic or oops.
  LAST_BOOT_OUTCOME_CRASHED = 4;
  // Records without a shutdown marker: reset by the watchdog (or a power cut).
  LAST_BOOT_OUTCOME_RESET = 5;
}

message LastBoot {
  LastBootOutcome outcome = 1;
  // The recorded reason where there is one, e.g. "update", "no-root".
  string reason = 2;
  // One line for people, e.g. "restarted (update)".
  string summary = 3;
}

// Runtime settings, persisted on the satellite and shared with Home Assistant.
message Settings {
  // 1 was a reply volume that could not say it follows `volume`;
  // `reply_volume` replaced it.
  reserved 1;
  // Wake word detection on or off.
  bool wake_word = 2;
  // Wake word sensitivity 0..=100: higher wakes more easily.
  uint32 wake_sensitivity = 3;
  // LED ring brightness 0..=100.
  uint32 led_brightness = 4;
  // The active wake words' ids, at most two, in Home Assistant's order.
  repeated string wake_words = 5;
  // The name Home Assistant shows (ADR 0007).
  string friendly_name = 6;
  // Nobody chose a name yet: `friendly_name` is the model and the last three
  // bytes of the MAC, e.g. "Echo Dot 2a914e".
  bool default_name = 7;
  // A chime when listening starts.
  bool wake_sound = 8;
  // The dashboard address (ADR 0021), e.g. "https://dot.example.com/"; empty
  // when none is set.
  string url = 13;
  // The AirPlay receiver on or off (ADR 0011). Off by default.
  bool airplay = 10;
  // Bluetooth audio from phones on or off (ADR 0011). Off by default.
  bool bluetooth = 11;
  // The IANA time zone name, e.g. "Europe/Berlin"; "UTC" until one is set
  // (ADR 0007).
  string time_zone = 12;
  // 9 was allowed_hosts, replaced by `url` (ADR 0021).
  reserved 9;
  // The volume of replies and announcements 0..=100, never louder than
  // `volume`. Unset: they follow `volume`.
  optional uint32 reply_volume = 14;
  // The listening ring points at the talker.
  bool listening_direction = 15;
}

message GetStatusRequest {}

message GetStatusResponse {
  Status status = 1;
}

message SetVolumeRequest {
  // 0..=100.
  uint32 percent = 1;
}

message SetVolumeResponse {
  Status status = 1;
}

message SetStreamVolumeRequest {
  // 0..=100, on the speaker volume's curve.
  uint32 percent = 1;
}

message SetStreamVolumeResponse {
  Status status = 1;
}

message SetStreamMetadataRequest {
  // The bridge's name, as its stream header gives it: `airplay` or
  // `bluetooth`, up to 16 of a-z, 0-9 and -.
  string source = 1;
  // Empty when the sender doesn't say. Each is cut to 256 bytes.
  string title = 2;
  string artist = 3;
  string album = 4;
}

message SetStreamMetadataResponse {
  Status status = 1;
}

message SetMuteRequest {
  bool muted = 1;
}

message SetMuteResponse {
  Status status = 1;
}

message StartConversationRequest {}

message StartConversationResponse {
  Status status = 1;
}

message StopConversationRequest {}

message StopConversationResponse {
  Status status = 1;
}

message LedTestRequest {}

message LedTestResponse {}

message ClearNotificationRequest {}

message ClearNotificationResponse {
  Status status = 1;
}

message WatchStatusRequest {}

message WatchStatusResponse {
  Status status = 1;
}

message WatchRingRequest {}

message WatchRingResponse {
  // The 12 pixels in ring order (pixels 10 and 11 straddle the front), 3
  // bytes each: red, green, blue, with the LED brightness setting applied.
  bytes frame = 1;
}

// Only the fields that are set change.
message UpdateSettingsRequest {
  reserved 1;
  optional bool wake_word = 2;
  optional uint32 wake_sensitivity = 3;
  optional uint32 led_brightness = 4;
  // At most two ids from Status.wake_word.available. Refused while Home
  // Assistant is connected: it chooses the wake words then.
  WakeWordIds wake_words = 5;
  // 1 to 64 characters (at most 200 bytes), no control characters; trimmed.
  // Home Assistant reads it when it next connects: pinnad makes it reconnect
  // once the satellite is idle.
  optional string friendly_name = 6;
  optional bool wake_sound = 7;
  // Refused on a device without a speaker or stream socket.
  optional bool airplay = 9;
  // Refused on a device without Bluetooth or a working speaker.
  optional bool bluetooth = 10;
  // The hostname, also the ESPHome node name (ADR 0010): one DNS label, 1 to 63
  // letters, digits and hyphens, stored lowercase. It applies at once; Home
  // Assistant reconnects once the satellite is idle.
  optional string hostname = 11;
  // One of ListTimeZones; it applies at once.
  optional string time_zone = 12;
  // The dashboard address (ADR 0021): `http` or `https`, a host and an optional
  // port, nothing after it; stored with a trailing `/`. Empty clears it. It
  // applies at once, and other satellites link to it.
  optional string url = 13;
  // 8 was allowed_hosts, replaced by `url`.
  reserved 8;
  // 0..=100: replies stop following `volume`.
  optional uint32 reply_volume = 14;
  // true: replies follow `volume` again; refused together with
  // `reply_volume`. false: they keep the current volume, until `reply_volume`
  // changes it.
  optional bool reply_follows_volume = 15;
  optional bool listening_direction = 16;
}

// Only the fields that are set change.
message SetRingLightRequest {
  optional bool on = 1;
  // 0..=100.
  optional uint32 brightness = 2;
  // 0xRRGGBB.
  optional uint32 rgb = 3;
  // One of RingLight.effects.
  optional string effect = 4;
}

message SetRingLightResponse {
  Status status = 1;
}

enum MediaCommand {
  MEDIA_COMMAND_UNSPECIFIED = 0;
  // Resume what is paused.
  MEDIA_COMMAND_PLAY = 1;
  MEDIA_COMMAND_PAUSE = 2;
  // Stop the music, or the announcement that plays.
  MEDIA_COMMAND_STOP = 3;
  MEDIA_COMMAND_MUTE = 4;
  MEDIA_COMMAND_UNMUTE = 5;
}

// Refused on a satellite without a working speaker.
message ControlMediaRequest {
  // Unspecified with `volume` set: only the volume changes.
  MediaCommand command = 1;
  // 0..=100, as Home Assistant's media player volume: the stream's own volume
  // while AirPlay or Bluetooth plays (the sender isn't told), Volume
  // otherwise.
  optional uint32 volume = 2;
}

message ControlMediaResponse {
  Status status = 1;
}

// Refused on a satellite without a working speaker.
message PlayMediaRequest {
  // An http:// or https:// URL, at most 2048 bytes, of MP3, FLAC, Ogg or WAV
  // audio. It replaces what plays; a voice request or an announcement plays
  // over it. The satellite fetches it from its own network, following
  // redirects.
  string url = 1;
}

message PlayMediaResponse {
  Status status = 1;
}

message ListTimeZonesRequest {}

message ListTimeZonesResponse {
  // The IANA zones this satellite has, from tzdata's zone1970.tab, plus UTC.
  repeated string zones = 1;
}

message ListSatellitesRequest {}

message ListSatellitesResponse {
  // Other satellites whose dashboard answered, by friendly name. Not this one.
  repeated Satellite satellites = 1;
  // This satellite has an address on a network, not only the USB link. When
  // false, nothing was asked and the list is empty.
  bool on_network = 2;
  // A search has finished since pinnad started. Until then the list is empty
  // because nothing has been asked yet.
  bool searched = 3;
}

// A satellite found by its ESPHome mDNS record (ADR 0021).
message Satellite {
  // Its ESPHome instance name: the node name, unless systemd-resolved
  // renamed the instance after a name conflict (ADR 0024). Links use `host`.
  string name = 1;
  string friendly_name = 2;
  // The model, e.g. "Echo Dot (2nd Gen)".
  string board = 3;
  string mac = 4;
  string version = 5;
  // The dashboard's port; 80 when the record has none (older firmware).
  uint32 web_port = 6;
  // Its dashboard address, when it has one set.
  string url = 7;
  // Addresses without the USB link's 10.42.0.0/24.
  repeated string ipv4 = 8;
  // Addresses without link-local ones.
  repeated string ipv6 = 9;
  // The host its SRV record names, without `.local`: the name that
  // resolves. Usually `name`, but systemd-resolved may rename either after
  // a name conflict (ADR 0024).
  string host = 10;
}

message UpdateSettingsResponse {
  Status status = 1;
}

message StartCalibrationRequest {}

message StartCalibrationResponse {
  Status status = 1;
}

message StopCalibrationRequest {}

message StopCalibrationResponse {
  Status status = 1;
}

message GetNetworkRequest {}

message Wifi {
  string ssid = 1;
  // Received signal strength in dBm (negative; closer to 0 is stronger).
  int32 signal_dbm = 2;
  uint32 frequency_mhz = 3;
  // As `iw` reports it, e.g. "72.2 MBit/s".
  string tx_bitrate = 4;
}

message Interface {
  string name = 1;
  string mac = 2;
  bool up = 3;
  // Addresses with prefix length, e.g. "192.168.1.20/24".
  repeated string addresses = 4;
  // Set for a wireless interface that is associated.
  Wifi wifi = 5;
  // A wireless interface, associated or not.
  bool wireless = 6;
}

message GetNetworkResponse {
  string hostname = 1;
  repeated Interface interfaces = 2;
  // The name systemd-resolved announces over mDNS, `<mdns_hostname>.local`.
  // Differs from hostname for a few minutes after resolved lost a name
  // conflict and picked another (ADR 0024). Empty when unknown.
  string mdns_hostname = 3;
}

message WatchLogsRequest {}

message LogLine {
  // Milliseconds since the Unix epoch.
  uint64 unix_ms = 1;
  // "ERROR", "WARN", "INFO", "DEBUG" or "TRACE".
  string level = 2;
  // Module the line comes from, e.g. "pinnad::voice".
  string target = 3;
  // The message with its fields, e.g. "esphome api listening addr=0.0.0.0:6053".
  string message = 4;
}

message WatchLogsResponse {
  LogLine line = 1;
}

message GetUpdatesRequest {}

message Slot {
  // "a" or "b".
  string name = 1;
  // Version of the signed image in the slot; empty when there is none.
  string version = 2;
  // "good", "trial" (tries_left boots before rollback) or "unbootable".
  string state = 3;
  uint32 tries_left = 4;
  // The slot boots next.
  bool active = 5;
  // The running system booted from this slot.
  bool booted = 6;
}

message GetUpdatesResponse {
  // A/B updates work here (started through pinna-init on a slot image).
  bool available = 1;
  // Why not, when `available` is false.
  string unavailable_reason = 2;
  string booted_version = 3;
  repeated Slot slots = 4;
  // An install is running (WatchInstall follows it).
  bool installing = 5;
  // The last install since pinnad started, if any.
  InstallResult last_install = 6;
  // Where a release is probably served: the browser's own address, port 8000
  // (`python3 -m http.server` in build/release, as the update docs show).
  string suggested_manifest = 7;
}

message InstallResult {
  bool ok = 1;
  string manifest = 2;
  // Milliseconds since the Unix epoch.
  uint64 finished_unix_ms = 3;
  // The last line of output: the error when `ok` is false.
  string last_line = 4;
}

message InstallUpdateRequest {
  // Release manifest: an http:// or https:// URL.
  string manifest = 1;
}

message InstallUpdateResponse {}

message WatchInstallRequest {}

message WatchInstallResponse {
  // One line of progress, as `pinnactl update` prints it.
  string line = 1;
  // Last message: the install finished, successfully or not.
  bool done = 2;
  bool ok = 3;
  // The stage `line` reports; UNSPECIFIED for lines that report none (errors, `done`).
  InstallStage stage = 4;
}

// How far an install got, from the line that reported it.
enum InstallStage {
  INSTALL_STAGE_UNSPECIFIED = 0;
  // The manifest is read and the target slot chosen.
  INSTALL_STAGE_CHECK = 1;
  // The image is streaming into the target slot.
  INSTALL_STAGE_DOWNLOAD = 2;
  // Written and flushed; sha256 matches.
  INSTALL_STAGE_WRITE = 3;
  // Signature and dm-verity checked on the slot.
  INSTALL_STAGE_VERIFY = 4;
  // The slot boots next, with tries before rollback.
  INSTALL_STAGE_INSTALLED = 5;
}

message SetActiveSlotRequest {
  // "a" or "b".
  string slot = 1;
}

message SetActiveSlotResponse {}

message RebootRequest {}

message RebootResponse {}

enum WifiSecurity {
  WIFI_SECURITY_UNSPECIFIED = 0;
  WIFI_SECURITY_OPEN = 1;
  // WPA/WPA2-Personal.
  WIFI_SECURITY_WPA_PSK = 2;
  // WPA3-Personal only: listed, this Wi-Fi chip can't join it.
  WIFI_SECURITY_SAE = 3;
  // 802.1X: listed, can't be joined.
  WIFI_SECURITY_ENTERPRISE = 4;
  // Listed, can't be joined.
  WIFI_SECURITY_WEP = 5;
}

// A network in range: the strongest access point with that name.
message WifiNetwork {
  string ssid = 1;
  // dBm, negative; closer to 0 is stronger.
  int32 signal_dbm = 2;
  uint32 frequency_mhz = 3;
  WifiSecurity security = 4;
  // Saved on the satellite.
  bool saved = 5;
  // The one in use.
  bool current = 6;
}

message ScanWifiRequest {}

message ScanWifiResponse {
  // Strongest first, one per name. Networks that hide their name are left out:
  // join those by name.
  repeated WifiNetwork networks = 1;
}

// A saved network. Its passphrase never leaves the satellite.
message SavedWifi {
  string ssid = 1;
  WifiSecurity security = 2;
  // Joined by name: the network doesn't broadcast it.
  bool hidden = 3;
  // The one in use.
  bool current = 4;
}

message ListWifiRequest {}

message ListWifiResponse {
  // Tried first to last.
  repeated SavedWifi saved = 1;
  // A join runs; JoinWifi's stream shows it.
  bool joining = 2;
  // The last finished join since pinnad started: its final step.
  JoinWifiResponse last_join = 3;
  // The network on trial, with `keep_seconds` left.
  JoinWifiResponse trial = 4;
}

message JoinWifiRequest {
  // 1 to 32 bytes.
  string ssid = 1;
  // OPEN or WPA_PSK.
  WifiSecurity security = 2;
  // WPA_PSK: 8 to 63 characters, or 64 hex digits. Empty for OPEN. Never
  // returned or logged.
  string passphrase = 3;
  // The network hides its name: probe for it by name.
  bool hidden = 4;
}

enum JoinStage {
  JOIN_STAGE_UNSPECIFIED = 0;
  // Finding the network and checking the password.
  JOIN_STAGE_CONNECTING = 1;
  // Connected; waiting for an address from the network's DHCP server.
  JOIN_STAGE_ADDRESS = 2;
  // On the new network at `address`, not saved: kept once the dashboard is
  // opened there or KeepWifi keeps it; back after `keep_seconds` otherwise,
  // or when the satellite restarts.
  JOIN_STAGE_TRIAL = 3;
  // Done: kept and saved.
  JOIN_STAGE_JOINED = 4;
  // Done: not joined, or not kept; back on the saved networks.
  JOIN_STAGE_FAILED = 5;
}

enum JoinFailure {
  JOIN_FAILURE_UNSPECIFIED = 0;
  // The network refused the password.
  JOIN_FAILURE_WRONG_PASSWORD = 1;
  // No network with that name answered.
  JOIN_FAILURE_NOT_FOUND = 2;
  // Connected, but no address came.
  JOIN_FAILURE_NO_ADDRESS = 3;
  // wpa_supplicant failed; `message` says how.
  JOIN_FAILURE_OTHER = 4;
  // On trial, but nobody kept it in time, or someone chose to go back.
  JOIN_FAILURE_NOT_KEPT = 5;
}

message JoinWifiResponse {
  string ssid = 1;
  JoinStage stage = 2;
  // One sentence for people.
  string message = 3;
  // JOINED: the new IPv4 address.
  string address = 4;
  // FAILED: why.
  JoinFailure failure = 5;
  // FAILED and TRIAL: the network it goes back to; empty for none.
  string fallback = 6;
  // TRIAL: seconds left to keep it.
  uint32 keep_seconds = 7;
}

message KeepWifiRequest {
  // False: go back now.
  bool keep = 1;
}

message KeepWifiResponse {
  // JOINED or FAILED.
  JoinWifiResponse result = 1;
}

message ForgetWifiRequest {
  string ssid = 1;
}

message ForgetWifiResponse {
  repeated SavedWifi saved = 1;
}

message StartBluetoothPairingRequest {}

message StartBluetoothPairingResponse {
  Status status = 1;
}

message StopBluetoothPairingRequest {}

message StopBluetoothPairingResponse {
  Status status = 1;
}

message ForgetBluetoothDeviceRequest {
  // An address from Status.bluetooth.devices.
  string address = 1;
}

message ForgetBluetoothDeviceResponse {
  Status status = 1;
}

message ReportBluetoothRequest {
  // The adapter is powered and the bridge's agent is registered.
  bool ready = 1;
  // The controller's address.
  string address = 2;
  // The paired phones.
  repeated BluetoothDevice devices = 3;
  // Why the bridge can't run, when it can't.
  string error = 4;
}

message ReportBluetoothResponse {}

message FactoryResetRequest {
  // The satellite's name, as typed by the person resetting it: the name Home
  // Assistant shows, or the node name. Case and surrounding spaces don't matter.
  string name = 1;
}

message FactoryResetResponse {}

syntax = "proto3";

package pinna.v1;

// Control API of pinnad, without authentication. Served on 127.0.0.1:7470 for
// pinnactl, and with the dashboard on the LAN (`[web]`, ADR 0005): anyone who can
// reach either listener can control the device.
service DeviceService {
  // Current state of the device.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Set the speaker volume.
  rpc SetVolume(SetVolumeRequest) returns (SetVolumeResponse);
  // Set the software microphone mute (the hardware latch is read-only).
  rpc SetMute(SetMuteRequest) returns (SetMuteResponse);
  // Start a voice conversation, like pressing the action button.
  rpc StartConversation(StartConversationRequest) returns (StartConversationResponse);
  // Stop the current conversation, announcement or timer alarm.
  rpc StopConversation(StopConversationRequest) returns (StopConversationResponse);
  // Run a short LED animation cycle.
  rpc LedTest(LedTestRequest) returns (LedTestResponse);
  // Clear a pending notification, like pressing the action button while the
  // ring shows it: Home Assistant sees the switch turn off and a `cleared` event.
  rpc ClearNotification(ClearNotificationRequest) returns (ClearNotificationResponse);
  // Current state, then again on every change.
  rpc WatchStatus(WatchStatusRequest) returns (stream WatchStatusResponse);
  // Change runtime settings; the same as changing them in Home Assistant.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // Start tuning the wake word sensitivity with the satellite's + and −
  // buttons. Fails while the microphones are muted, the wake word is off, or
  // a request or timer alarm is active.
  rpc StartCalibration(StartCalibrationRequest) returns (StartCalibrationResponse);
  // Stop it, keeping the sensitivity as it is; UpdateSettings undoes a change.
  rpc StopCalibration(StopCalibrationRequest) returns (StopCalibrationResponse);
  // Network interfaces, addresses and Wi-Fi link.
  rpc GetNetwork(GetNetworkRequest) returns (GetNetworkResponse);
  // pinnad's recent log lines, then new ones as they are written.
  rpc WatchLogs(WatchLogsRequest) returns (stream WatchLogsResponse);
  // The A/B slots and the running version.
  rpc GetUpdates(GetUpdatesRequest) returns (GetUpdatesResponse);
  // Start installing a release into the inactive slot (`pinnactl update`).
  // pinnad runs the install; it goes on when the caller goes away.
  rpc InstallUpdate(InstallUpdateRequest) returns (InstallUpdateResponse);
  // Progress of the running (or last) install: its lines so far, then new ones,
  // ending after the line marked done.
  rpc WatchInstall(WatchInstallRequest) returns (stream WatchInstallResponse);
  // Restart the satellite.
  rpc Reboot(RebootRequest) returns (RebootResponse);
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_IDLE = 1;
  PHASE_LISTENING = 2;
  PHASE_THINKING = 3;
  PHASE_SPEAKING = 4;
}

message Timer {
  string id = 1;
  string name = 2;
  uint32 seconds_left = 3;
  uint32 total_seconds = 4;
  bool active = 5;
}

message WakeWord {
  // The active words' phrases for display, e.g. "Alexa" or "Alexa or Hey
  // Jarvis"; empty when none is active.
  string phrase = 1;
  // Wake word detection is currently armed (idle, unmuted, voice subscribed).
  bool enabled = 2;
  // The score a wake needs at the current sensitivity, 0..1.
  float threshold = 3;
  // Wakes and near misses while detection was armed, since pinnad started:
  // oldest first, at most 20.
  repeated WakeEvent recent = 4;
  // Tuning with the satellite's buttons, while it runs.
  Calibration calibration = 5;
  // Every word the satellite can listen for (ADR 0013).
  repeated WakeWordOption available = 6;
}

message WakeWordOption {
  // Stable id, as Home Assistant knows it (e.g. "alexa_v0.1").
  string id = 1;
  // What to say, e.g. "Alexa".
  string phrase = 2;
}

// A list of wake word ids, so that UpdateSettingsRequest can tell "unchanged"
// from "none".
message WakeWordIds {
  repeated string ids = 1;
}

// Sensitivity calibration from the satellite's + and − buttons, started from
// the dashboard or Home Assistant. The buttons are volume buttons outside one.
message Calibration {
  // The sensitivity when calibration started, which Undo restores.
  uint32 started_from = 1;
  // What happened so far, oldest first, at most 10.
  repeated CalibrationEvent events = 2;
}

message CalibrationEvent {
  // Counts up from 1 within a calibration.
  uint32 id = 1;
  CalibrationEventKind kind = 2;
  // The + (raise) or − button; false for a wake.
  bool raise = 3;
  // The wake's or near miss's score, when the press referred to one.
  optional float score = 4;
  // Sensitivity before and after; equal for an event that changed nothing.
  uint32 from = 5;
  uint32 to = 6;
}

enum CalibrationEventKind {
  CALIBRATION_EVENT_KIND_UNSPECIFIED = 0;
  // The detector woke; no request started.
  CALIBRATION_EVENT_KIND_WOKE = 1;
  // + raised the sensitivity, to catch a near miss.
  CALIBRATION_EVENT_KIND_RAISED = 2;
  // − lowered it, to ignore a false wake.
  CALIBRATION_EVENT_KIND_LOWERED = 3;
  // A press with nothing heard in the feedback window.
  CALIBRATION_EVENT_KIND_NOTHING_HEARD = 4;
  // A press no setting can fix: a near miss below what 100 catches, or one that
  // reached the threshold and was rejected for another reason (+); a wake
  // every setting accepts (−).
  CALIBRATION_EVENT_KIND_NO_SETTING_HELPS = 5;
  // Refused: the change would undo a press the other way, because the real wake
  // and the false one score about the same here.
  CALIBRATION_EVENT_KIND_WOULD_UNDO = 6;
}

// A wake, or a near miss: speech that scored at least 0.20 without waking the
// satellite.
message WakeEvent {
  // Milliseconds since the Unix epoch.
  uint64 unix_ms = 1;
  bool woke = 2;
  // The detector's peak score, 0..1.
  float score = 3;
  // The lowest sensitivity at which this score wakes the satellite; unset when
  // even 100 doesn't.
  optional uint32 wakes_from = 4;
  // A near miss whose score reached the threshold, rejected by the detector's
  // other rules (too quiet against the background noise, or too short). The
  // sensitivity doesn't change that.
  bool reached_threshold = 5;
}

message Status {
  string version = 1;
  // ESPHome node name.
  string name = 2;
  string mac = 3;
  uint64 uptime_seconds = 4;
  Phase phase = 5;
  // Muted by either source.
  bool muted = 6;
  bool hardware_muted = 7;
  bool software_muted = 8;
  // Logical volume 0..=100.
  uint32 volume = 9;
  // Home Assistant is connected to the ESPHome API.
  bool ha_connected = 10;
  // Home Assistant subscribed to voice assistant runs.
  bool voice_subscribed = 11;
  WakeWord wake_word = 12;
  repeated Timer timers = 13;
  // Resolved audio backend ("echodot", "pipewire", "wav", "none").
  string audio_backend = 14;
  // LED backend ("is31", "mock", "virtual", "none").
  string led_backend = 15;
  // A finished timer's alarm is sounding; StopConversation silences it.
  bool alarm_ringing = 16;
  Settings settings = 17;
  // Which hardware this is, as a stable id for the dashboard's drawing:
  // "echo-dot-2" for the Echo Dot (2nd gen), "echo-2" for the Echo
  // (2nd gen); empty when unknown (QEMU, a PC).
  string model = 18;
  // A notification is pending (Home Assistant's "Notification" switch); the ring
  // pulses while idle. ClearNotification clears it.
  bool notification = 19;
  // A virtual Echo Dot in the development VM (ADR 0014): its microphone,
  // speaker, buttons and microphone switch are on the /virtual-device socket.
  bool virtual_device = 20;
  // How the boot before this one ended, from pstore (ADR 0012).
  LastBoot last_boot = 21;
}

// How the previous boot ended, as pinnad read it back from the pstore records
// of the boot before this one.
enum LastBootOutcome {
  LAST_BOOT_OUTCOME_UNSPECIFIED = 0;
  // No records: this is the first start, or the power was lost.
  LAST_BOOT_OUTCOME_COLD_START = 1;
  // A recorded, clean restart; `reason` says why ("update", "user", ...).
  LAST_BOOT_OUTCOME_RESTARTED = 2;
  // The boot ended in rescue mode; `reason` says why ("no-root", ...).
  LAST_BOOT_OUTCOME_RESCUE = 3;
  // A kernel panic or oops.
  LAST_BOOT_OUTCOME_CRASHED = 4;
  // Records without a shutdown marker: reset by the watchdog (or a power cut).
  LAST_BOOT_OUTCOME_RESET = 5;
}

message LastBoot {
  LastBootOutcome outcome = 1;
  // The recorded reason where there is one, e.g. "update", "no-root".
  string reason = 2;
  // One line for people, e.g. "restarted (update)".
  string summary = 3;
}

// Runtime settings, persisted on the satellite and shared with Home Assistant.
message Settings {
  // 1 was reply_volume: it follows `volume` unless set, which Home Assistant manages.
  reserved 1;
  // Wake word detection on or off.
  bool wake_word = 2;
  // Wake word sensitivity 0..=100: higher wakes more easily.
  uint32 wake_sensitivity = 3;
  // LED ring brightness 0..=100.
  uint32 led_brightness = 4;
  // The active wake words' ids, at most two, in Home Assistant's order.
  repeated string wake_words = 5;
}

message GetStatusRequest {}

message GetStatusResponse {
  Status status = 1;
}

message SetVolumeRequest {
  // 0..=100.
  uint32 percent = 1;
}

message SetVolumeResponse {
  Status status = 1;
}

message SetMuteRequest {
  bool muted = 1;
}

message SetMuteResponse {
  Status status = 1;
}

message StartConversationRequest {}

message StartConversationResponse {
  Status status = 1;
}

message StopConversationRequest {}

message StopConversationResponse {
  Status status = 1;
}

message LedTestRequest {}

message LedTestResponse {}

message ClearNotificationRequest {}

message ClearNotificationResponse {
  Status status = 1;
}

message WatchStatusRequest {}

message WatchStatusResponse {
  Status status = 1;
}

// Only the fields that are set change.
message UpdateSettingsRequest {
  reserved 1;
  optional bool wake_word = 2;
  optional uint32 wake_sensitivity = 3;
  optional uint32 led_brightness = 4;
  // At most two ids from Status.wake_word.available. Refused while Home
  // Assistant is connected: it chooses the wake words then.
  WakeWordIds wake_words = 5;
}

message UpdateSettingsResponse {
  Status status = 1;
}

message StartCalibrationRequest {}

message StartCalibrationResponse {
  Status status = 1;
}

message StopCalibrationRequest {}

message StopCalibrationResponse {
  Status status = 1;
}

message GetNetworkRequest {}

message Wifi {
  string ssid = 1;
  // Received signal strength in dBm (negative; closer to 0 is stronger).
  int32 signal_dbm = 2;
  uint32 frequency_mhz = 3;
  // As `iw` reports it, e.g. "72.2 MBit/s".
  string tx_bitrate = 4;
}

message Interface {
  string name = 1;
  string mac = 2;
  bool up = 3;
  // Addresses with prefix length, e.g. "192.168.1.20/24".
  repeated string addresses = 4;
  // Set for a wireless interface that is associated.
  Wifi wifi = 5;
  // A wireless interface, associated or not.
  bool wireless = 6;
}

message GetNetworkResponse {
  string hostname = 1;
  repeated Interface interfaces = 2;
}

message WatchLogsRequest {}

message LogLine {
  // Milliseconds since the Unix epoch.
  uint64 unix_ms = 1;
  // "ERROR", "WARN", "INFO", "DEBUG" or "TRACE".
  string level = 2;
  // Module the line comes from, e.g. "pinnad::voice".
  string target = 3;
  // The message with its fields, e.g. "esphome api listening addr=0.0.0.0:6053".
  string message = 4;
}

message WatchLogsResponse {
  LogLine line = 1;
}

message GetUpdatesRequest {}

message Slot {
  // "a" or "b".
  string name = 1;
  // Version of the signed image in the slot; empty when there is none.
  string version = 2;
  // "good", "trial" (tries_left boots before rollback) or "unbootable".
  string state = 3;
  uint32 tries_left = 4;
  // The slot boots next.
  bool active = 5;
  // The running system booted from this slot.
  bool booted = 6;
}

message GetUpdatesResponse {
  // A/B updates work here (started through pinna-init on a slot image).
  bool available = 1;
  // Why not, when `available` is false.
  string unavailable_reason = 2;
  string booted_version = 3;
  repeated Slot slots = 4;
  // An install is running (WatchInstall follows it).
  bool installing = 5;
  // The last install since pinnad started, if any.
  InstallResult last_install = 6;
  // Where a release is probably served: the browser's own address, port 8000
  // (`python3 -m http.server` in build/release, as the update docs show).
  string suggested_manifest = 7;
}

message InstallResult {
  bool ok = 1;
  string manifest = 2;
  // Milliseconds since the Unix epoch.
  uint64 finished_unix_ms = 3;
  // The last line of output: the error when `ok` is false.
  string last_line = 4;
}

message InstallUpdateRequest {
  // Release manifest: an http:// or https:// URL.
  string manifest = 1;
}

message InstallUpdateResponse {}

message WatchInstallRequest {}

message WatchInstallResponse {
  // One line of progress, as `pinnactl update` prints it.
  string line = 1;
  // Last message: the install finished, successfully or not.
  bool done = 2;
  bool ok = 3;
  // The stage `line` reports; UNSPECIFIED for lines that report none (errors, `done`).
  InstallStage stage = 4;
}

// How far an install got, from the line that reported it.
enum InstallStage {
  INSTALL_STAGE_UNSPECIFIED = 0;
  // The manifest is read and the target slot chosen.
  INSTALL_STAGE_CHECK = 1;
  // The image is streaming into the target slot.
  INSTALL_STAGE_DOWNLOAD = 2;
  // Written and flushed; sha256 matches.
  INSTALL_STAGE_WRITE = 3;
  // Signature and dm-verity checked on the slot.
  INSTALL_STAGE_VERIFY = 4;
  // The slot boots next, with tries before rollback.
  INSTALL_STAGE_INSTALLED = 5;
}

message RebootRequest {}

message RebootResponse {}

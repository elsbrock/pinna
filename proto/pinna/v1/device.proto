message GetUpdatesRequest {}

message Slot {
  // "a" or "b".
  string name = 1;
  // Version of the signed image in the slot; empty when there is none.
  string version = 2;
  // "good", "trial" (tries_left boots before rollback) or "unbootable".
  string state = 3;
  uint32 tries_left = 4;
  // The slot boots next.
  bool active = 5;
  // The running system booted from this slot.
  bool booted = 6;
  // The slot holds a version older than the running one, by the order
  // updates use. The dashboard warns before it starts: it may not ask for a
  // password (ADR 0029).
  bool older_than_running = 7;
}

message GetUpdatesResponse {
  // A/B updates work here (started through pinna-init on a slot image).
  bool available = 1;
  // Why not, when `available` is false.
  string unavailable_reason = 2;
  string booted_version = 3;
  repeated Slot slots = 4;
  // An install is running (WatchInstall follows it).
  bool installing = 5;
  // The last install since pinnad started, if any.
  InstallResult last_install = 6;
  // Where a release is probably served: the browser's own address, port 8000
  // (`python3 -m http.server` in build/release, as the update docs show).
  string suggested_manifest = 7;
  // pinnad.toml's `[update] manifest`, checked instead of the channel;
  // empty when unset.
  string manifest_override = 8;
  UpdateCheck check = 9;
  // The release the last successful check found. Unset before one, while
  // Updates is off, and while the channel has no release.
  Release release = 10;
  // An install started from Home Assistant, or by asking the satellite, has
  // finished: pinnad restarts the satellite once it is Idle with no timer set
  // and nothing playing.
  bool restart_pending = 11;
  // A `just push` overlay is active (/var/lib/extensions/pinna-dev):
  // installs are refused until it is removed.
  bool development_overlay = 12;
  // This build compiles in a developer's key: it installs only images signed
  // with that key, and starts with Updates off.
  bool development_build = 13;
}

// The update channel's checks (ADR 0022).
message UpdateCheck {
  // A check runs now.
  bool checking = 1;
  // When the last check finished, in milliseconds since the Unix epoch; 0
  // when none has since pinnad started.
  uint64 finished_unix_ms = 2;
  // Why the last check failed, in words for people; empty when it
  // succeeded. A failed check keeps the release an earlier one found.
  string error = 3;
  // The last check succeeded and the channel has no release yet.
  bool no_release = 4;
  // When the next scheduled check runs; 0 while Updates is off.
  uint64 next_unix_ms = 5;
}

// A release a check found.
message Release {
  string version = 1;
  // "stable" or "beta".
  string channel = 2;
  // One line, at most 255 characters.
  string summary = 3;
  // The release notes; may be empty.
  string notes_url = 4;
  // What InstallUpdate does with it.
  ReleaseAction action = 5;
  // For people: why it can't be installed (BLOCKED, FAILED, OTHER_MODEL);
  // empty otherwise.
  string note = 6;
}

enum ReleaseAction {
  RELEASE_ACTION_UNSPECIFIED = 0;
  // Newer than the running version: InstallUpdate installs it.
  RELEASE_ACTION_INSTALL = 1;
  // The running version.
  RELEASE_ACTION_UP_TO_DATE = 2;
  // Older than the running version: only after the owner confirmed it,
  // InstallUpdate with `older`. When the other slot holds it, SetActiveSlot
  // starts it instead.
  RELEASE_ACTION_OLDER = 3;
  // The other slot holds it, verified, but doesn't boot next (held back):
  // InstallUpdate makes it boot next without downloading it again.
  RELEASE_ACTION_START = 4;
  // Installed in the other slot, which boots next: it runs after a restart.
  RELEASE_ACTION_RESTART = 5;
  // It failed its trial boot and was rolled back; not offered again.
  RELEASE_ACTION_FAILED = 6;
  // InstallUpdate would refuse it: a newer boot image is needed, a
  // `just push` overlay is active, or the running version is still on trial.
  // `note` says which.
  RELEASE_ACTION_BLOCKED = 7;
  // It is for another model: not offered, and not shown in Home Assistant.
  // `note` names the models it is for.
  RELEASE_ACTION_OTHER_MODEL = 8;
}


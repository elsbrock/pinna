  // Refused on a device without Bluetooth or a working speaker.
  optional bool bluetooth = 10;
  // The hostname, also the ESPHome node name (ADR 0010): one DNS label, 1 to 63
  // letters, digits and hyphens, stored lowercase. It applies at once; Home
  // Assistant reconnects once the satellite is idle.
  optional string hostname = 11;
  // One of ListTimeZones; it applies at once.
  optional string time_zone = 12;
  // The dashboard address (ADR 0021): `http` or `https`, a host and an optional
  // port, nothing after it; stored with a trailing `/`. Empty clears it. It
  // applies at once, and other satellites link to it.
  optional string url = 13;
  // 8 was allowed_hosts, replaced by `url`.
  reserved 8;
  // 0..=100: replies stop following `volume`.
  optional uint32 reply_volume = 14;
  // true: replies follow `volume` again; refused together with
  // `reply_volume`. false: they keep the current volume, until `reply_volume`
  // changes it.
  optional bool reply_follows_volume = 15;
  optional bool listening_direction = 16;
  // Not UNSPECIFIED. Refused while pinnad.toml sets `[update] manifest`. A
  // change checks the new channel at once.
  optional UpdateChannel update_channel = 17;
  // Standalone mode is refused until its services are configured (ADR 0017).
  optional Mode mode = 18;
  // Off: messages from the satellite group are refused. Messages already
  // held still play.
  optional bool group_messages = 19;
  // Refused on a device without a working speaker.
  optional bool sendspin = 20;
  // Not UNSPECIFIED. Turning it on plans an install for a release a check
  // already found; turning it off cancels one that hasn't started.
  optional InstallUpdates install_updates = 21;
  // "HH:MM", 24 hours. Start and end can't be the same time; the result of
  // both fields together is what counts, so a swap works in one request.
  optional string install_window_start = 22;
  optional string install_window_end = 23;
  // Off: the daily update check doesn't name the hardware.
  optional bool include_in_statistics = 24;
}


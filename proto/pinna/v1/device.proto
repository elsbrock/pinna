// The dashboard's access state (ADR 0029).
message Security {
  // A password is set.
  bool password_set = 1;
  // The owner chose "Leave it open".
  bool left_open = 2;
  // The dashboard should offer a password: none is set and nobody left it open.
  bool offer_pending = 3;
  // This request carries a valid session. False without one, also while no
  // password is set.
  bool signed_in = 4;
  // The last four characters of the metrics token; empty while none exists.
  string metrics_token_last4 = 5;
  // The last four characters of the agent token; empty while none exists.
  string agent_token_last4 = 6;
  // Failed logins, and wrong current passwords, since the last login.
  uint32 failures_since_login = 7;
  // The address of the last failure; empty when there is none.
  string last_failure_address = 8;
  // When it happened, in Unix milliseconds; 0 when there is none.
  uint64 last_failure_unix_ms = 9;
  // Seconds until a login attempt is taken again; 0 when one is.
  uint32 login_retry_after_s = 10;
  // Seconds until a new confirmation may start; 0 when one may.
  uint32 confirmation_cooldown_s = 11;
  // For the first-password form: the MCP clients that called /mcp in the last
  // 24 hours, by the name they gave, newest first.
  repeated string mcp_clients = 12;
  // /metrics was read in the last 24 hours.
  bool metrics_read = 13;
  // Seconds left in which the ESPHome API takes connections without a key,
  // after OpenHomeAssistantWindow; 0 when the window is closed.
  uint32 home_assistant_window_left_s = 14;
  // Seconds left in which a Join is accepted, after AllowGroupJoin; 0 when
  // none is.
  uint32 group_join_left_s = 15;
  // The address that asked for the confirmation that waits; empty when none
  // does, and without a session.
  string confirmation_waiting_from = 16;
  // Seconds that confirmation still waits; 0 when none does, and without a
  // session.
  uint32 confirmation_left_s = 17;
  // What that confirmation is for; PASSWORD when none waits, and without a
  // session.
  ConfirmationPurpose confirmation_purpose = 18;
}

message SetDashboardPasswordRequest {
  // 8 to 128 characters.
  string new_password = 1;
  // The current password, when one is set.
  string current_password = 2;
  // A grant from a confirmation, instead of the current password.
  string grant = 3;
}

message SetDashboardPasswordResponse {
  Security security = 1;
}

message RemoveDashboardPasswordRequest {
  string current_password = 1;
  string grant = 2;
}

message RemoveDashboardPasswordResponse {
  Security security = 1;
}

message LeaveDashboardOpenRequest {}

message LeaveDashboardOpenResponse {
  Security security = 1;
}

// What a press of Action is asked for. A grant is good only for its purpose.
enum ConfirmationPurpose {
  // Setting or removing the dashboard password (ADR 0029).
  CONFIRMATION_PURPOSE_PASSWORD = 0;
  // A recording (ADR 0030): needs a password and a session; the ring shows
  // its own pattern, and the grant is good for 10 seconds, for the session
  // that asked.
  CONFIRMATION_PURPOSE_RECORDING = 1;
  // What was said, in the debugging timeline (ADR 0036): like a recording,
  // it needs a password and a session, the grant is good for 10 seconds for
  // the session that asked, and the ring shows the recording pattern.
  CONFIRMATION_PURPOSE_DEBUGGING_TEXT = 2;
}

message StartConfirmationRequest {
  ConfirmationPurpose purpose = 1;
}

message StartConfirmationResponse {
  // Pass it to WatchConfirmation.
  string id = 1;
  // Seconds the confirmation waits for a press.
  uint32 seconds = 2;
}

message WatchConfirmationRequest {
  string id = 1;
}

message CancelConfirmationRequest {
  // The confirmation to end. Empty: whichever one waits (needs a session).
  string id = 1;
}

message CancelConfirmationResponse {}

enum ConfirmationState {
  CONFIRMATION_STATE_UNSPECIFIED = 0;
  // The ring shows the confirm pattern; nobody pressed Action yet.
  CONFIRMATION_STATE_WAITING = 1;
  // Action was pressed; the message carries the grant.
  CONFIRMATION_STATE_CONFIRMED = 2;
  // Nobody pressed it in time.
  CONFIRMATION_STATE_EXPIRED = 3;
  // The browser that asked, or a signed-in owner, stopped it.
  CONFIRMATION_STATE_CANCELED = 4;
}

message WatchConfirmationResponse {
  ConfirmationState state = 1;
  // Seconds left while waiting.
  uint32 seconds_left = 2;
  // One-time grant, valid for 5 minutes (10 seconds for a recording), once:
  // with CONFIRMED only.
  string grant = 3;
}

message RecordAudioRequest {
  // From a RECORDING confirmation this session asked for.
  string grant = 1;
  // 1 to 30.
  uint32 seconds = 2;
}

// The signals of a recording. Each arrives in its own chunks, in order, at
// 16 kHz from the start of the recording; the streams start within tens of
// milliseconds of each other but are not aligned to the sample.
enum AudioSource {
  AUDIO_SOURCE_UNSPECIFIED = 0;
  // What the wake word and the request get, after pinnad's gain: s16le mono.
  AUDIO_SOURCE_HEARD = 1;
  // The capture node's lanes as the codec delivers them: s24le, interleaved,
  // RecordingStarted.lanes of them.
  AUDIO_SOURCE_LANES = 2;
  // The echo canceller's output before pinnad's gain: s16le mono.
  AUDIO_SOURCE_BEFORE_GAIN = 3;
  // The echo reference, as the echo canceller gets it: s16le mono.
  AUDIO_SOURCE_REFERENCE = 4;
}

message RecordAudioResponse {
  oneof event {
    // First: what follows.
    RecordingStarted started = 1;
    RecordingChunk chunk = 2;
    // Last.
    RecordingEnded ended = 3;
  }
}

message RecordingStarted {
  uint32 sample_rate = 1;
  uint32 seconds = 2;
  // LANES, BEFORE_GAIN and REFERENCE follow too: the Echo's PipeWire graph.
  // Otherwise HEARD alone.
  bool debug = 3;
  // How many lanes LANES has; 0 without `debug`.
  uint32 lanes = 4;
}

message RecordingChunk {
  AudioSource source = 1;
  bytes data = 2;
}

enum RecordingEnd {
  RECORDING_END_UNSPECIFIED = 0;
  RECORDING_END_TIME_UP = 1;
  // StopRecording, from this dashboard or another.
  RECORDING_END_STOPPED = 2;
  // The microphones were muted.
  RECORDING_END_MUTED = 3;
  // The caller fell more than 2 seconds behind.
  RECORDING_END_FELL_BEHIND = 4;
  // A capture stream failed; the message says which.
  RECORDING_END_FAILED = 5;
}

message RecordingEnded {
  RecordingEnd reason = 1;
  // One sentence for the owner.
  string message = 2;
}

message StopRecordingRequest {}

message StopRecordingResponse {}

enum TokenKind {
  TOKEN_KIND_UNSPECIFIED = 0;
  // Reads /metrics.
  TOKEN_KIND_METRICS = 1;
  // Opens /mcp.
  TOKEN_KIND_AGENT = 2;
}

message CreateTokenRequest {
  TokenKind kind = 1;
}

message CreateTokenResponse {
  // Shown once: only its SHA-256 is kept.
  string token = 1;
  Security security = 2;
}

message OpenHomeAssistantWindowRequest {}

message OpenHomeAssistantWindowResponse {
  Security security = 1;
}

message AllowGroupJoinRequest {}

message AllowGroupJoinResponse {
  Security security = 1;
}

message SignOutEverywhereRequest {}

message SignOutEverywhereResponse {
  Security security = 1;
}

message StartDebuggingRequest {
  // 15, 60 or 480. The audio levels and what was said stop after 60 at most.
  uint32 minutes = 1;
  // Record the audio levels. Needs a password and a session.
  bool levels = 2;
  // The grant of a DEBUGGING_TEXT confirmation; empty records no text.
  string text_grant = 3;
}

message StartDebuggingResponse {}

message StopDebuggingRequest {}

message StopDebuggingResponse {}

message WatchTimelineRequest {}

message WatchTimelineResponse {
  oneof item {
    TimelineState state = 1;
    TimelineBatch batch = 2;
  }
}

// Whether debugging runs and what it records. Sent first, and again at every
// change.
message TimelineState {
  bool on = 1;
  // Unix milliseconds when each part stops; 0 = not recorded.
  uint64 until_unix_ms = 2;
  uint64 levels_until_unix_ms = 3;
  uint64 text_until_unix_ms = 4;
  // The length of a level bucket, 100.
  uint32 bucket_ms = 5;
  // The page drops what it holds: debugging was stopped or the sessions ended.
  bool cleared = 6;
  // The satellite's clock, to line the page's clock up with it.
  uint64 now_unix_ms = 7;
  // How long entries are kept, 600.
  uint32 keep_seconds = 8;
}

// New entries. A request is sent whole at each change and replaces the one
// with the same id.
message TimelineBatch {
  repeated TimelineEvent events = 1;
  repeated TimelineRequest requests = 2;
  repeated TimelineLevels levels = 3;
}

enum TimelineEventKind {
  TIMELINE_EVENT_KIND_UNSPECIFIED = 0;
  TIMELINE_EVENT_KIND_PHASE = 1;
  TIMELINE_EVENT_KIND_MUTED = 2;
  TIMELINE_EVENT_KIND_UNMUTED = 3;
  TIMELINE_EVENT_KIND_WAKE = 4;
  TIMELINE_EVENT_KIND_NEAR_MISS = 5;
  TIMELINE_EVENT_KIND_RUN = 6;
  TIMELINE_EVENT_KIND_END_OF_SPEECH = 7;
  TIMELINE_EVENT_KIND_INTERRUPTED = 8;
  TIMELINE_EVENT_KIND_ERROR = 9;
  TIMELINE_EVENT_KIND_HOME_ASSISTANT = 10;
  TIMELINE_EVENT_KIND_STAGE = 11;
  TIMELINE_EVENT_KIND_MODE = 12;
  TIMELINE_EVENT_KIND_WAKE_WORD = 13;
  TIMELINE_EVENT_KIND_CALIBRATION = 14;
  TIMELINE_EVENT_KIND_MICROPHONE = 15;
}

message TimelineEvent {
  uint64 unix_ms = 1;
  TimelineEventKind kind = 2;
  // Words for the page: a milestone, a cause, a Home Assistant event, a
  // stage, a word or a mode.
  string detail = 3;
  // For PHASE.
  Phase phase = 4;
  // For WAKE and NEAR_MISS.
  float score = 5;
  float threshold = 6;
  float level_dbfs = 7;
  float gain_db = 8;
  // For STAGE: when it ended; 0 for an instant.
  uint64 end_unix_ms = 9;
  // A standalone run's id; 0 otherwise.
  uint64 run = 10;
}

enum TimelineRequestKind {
  TIMELINE_REQUEST_KIND_UNSPECIFIED = 0;
  TIMELINE_REQUEST_KIND_PROVIDER = 1;
  TIMELINE_REQUEST_KIND_MCP = 2;
  TIMELINE_REQUEST_KIND_TOOL = 3;
  TIMELINE_REQUEST_KIND_MEDIA = 4;
  TIMELINE_REQUEST_KIND_GROUP = 5;
}

enum TimelineOutcome {
  TIMELINE_OUTCOME_OPEN = 0;
  TIMELINE_OUTCOME_DONE = 1;
  // The caller stopped reading before the end.
  TIMELINE_OUTCOME_DROPPED = 2;
  TIMELINE_OUTCOME_TIMEOUT = 3;
  TIMELINE_OUTCOME_UNREACHABLE = 4;
  TIMELINE_OUTCOME_TLS = 5;
  TIMELINE_OUTCOME_PROTOCOL = 6;
}

message TimelineRequest {
  uint64 id = 1;
  TimelineRequestKind kind = 2;
  string method = 3;
  // Cut as ADR 0036 says: no query, and only the host for media and MCP.
  string url = 4;
  uint64 start_unix_ms = 5;
  uint32 status = 6;
  uint64 response_unix_ms = 7;
  uint64 first_body_unix_ms = 8;
  // 0 while open.
  uint64 end_unix_ms = 9;
  optional uint64 bytes_out = 10;
  uint64 bytes_in = 11;
  TimelineOutcome outcome = 12;
  // Only while what was said is recorded.
  string body_out = 13;
  string body_in = 14;
}

// Consecutive buckets from start_unix_ms, bucket_ms apart. NaN = nothing was
// computed then.
message TimelineLevels {
  uint64 start_unix_ms = 1;
  repeated float before_gain_dbfs = 2;
  repeated float after_gain_dbfs = 3;
  repeated float gain_db = 4;
  repeated float speaker_dbfs = 5;
  repeated bool speech = 6;
  repeated TimelineWord words = 7;
}

message TimelineWord {
  string name = 1;
  float threshold = 2;
  repeated float scores = 3;
}

syntax = "proto3";

package pinna.v1;

import "pinna/v1/device.proto";

// Standalone mode's setup (ADR 0017): the provider connections, the
// speech-to-text, brain and text-to-speech slots, the conversation, the tools
// and the owner's MCP servers. Served with the dashboard, without
// authentication, like DeviceService.
//
// Keys and MCP server addresses are write-only: no response carries them. A
// key shows as set, with its last four characters; an MCP server by its host.
//
// An edit is refused with INVALID_ARGUMENT when it is wrong in itself,
// FAILED_PRECONDITION when a provider's check or the satellite refuses it
// now, and ABORTED when it names a revision that changed meanwhile. Every
// refusal is one sentence for the owner, and a refused edit changes nothing.
service AssistantService {
  // Everything the Assistant pages show.
  rpc GetAssistant(GetAssistantRequest) returns (GetAssistantResponse);
  // Add or change a connection. The slots that use it are checked again
  // with the new address and key; in standalone mode each one must pass.
  rpc SetConnection(SetConnectionRequest) returns (SetConnectionResponse);
  // Remove a connection and its key. In standalone mode one that a slot uses
  // can't be removed; in Home Assistant mode those slots are cleared with it.
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);
  // Point a slot at a connection. It is saved only when its check passes,
  // and is then ready. A check never sends a prompt.
  rpc SetSlot(SetSlotRequest) returns (SetSlotResponse);
  // Change the settings that need no provider check.
  rpc UpdateAssistant(UpdateAssistantRequest) returns (UpdateAssistantResponse);
  // Add or change one of the owner's MCP servers, whose tools the brain may
  // call. At most 8.
  rpc SetMcpServer(SetMcpServerRequest) returns (SetMcpServerResponse);
  // Remove an MCP server and its address.
  rpc DeleteMcpServer(DeleteMcpServerRequest) returns (DeleteMcpServerResponse);
  // Speak a text with the text-to-speech slot, in either mode. Refused while a
  // request runs, a timer alarm rings or the satellite is already saying
  // something (a reply, a chime, an announcement or another sample); music
  // ducks under it. Answers at the first audio or with why it failed.
  rpc PlaySample(PlaySampleRequest) returns (PlaySampleResponse);
  // Ask the brain a typed question, as if it was spoken. Standalone mode
  // only; the reply is spoken.
  rpc AskText(AskTextRequest) returns (AskTextResponse);
  // What a connection's service offers for a slot, as it lists them now:
  // suggestions for the model and voice fields. Empty when it lists none;
  // a failure is `failed_precondition` with the check's sentence.
  rpc ListChoices(ListChoicesRequest) returns (ListChoicesResponse);
  // The satellite group (ADR 0026): its switches, its members and the
  // satellites the search found. The group's key is never returned.
  rpc GetSatelliteGroup(GetSatelliteGroupRequest) returns (GetSatelliteGroupResponse);
  // Turn Satellite group or Control from the group on or off. Turning
  // Satellite group off leaves the group: the other members are told first.
  rpc SetSatelliteGroup(SetSatelliteGroupRequest) returns (SetSatelliteGroupResponse);
  // Add a satellite the search found to this satellite's group, or start a
  // group of the two. The satellite added takes the group first, which it
  // does only while its Satellite group switch is on and it is in no group;
  // the other members hear of it after. A refusal is `failed_precondition`
  // with the reason, `aborted` when the group changed meanwhile,
  // `invalid_argument` when the satellite's entry in the member list can't
  // change any more, and `unavailable` while the satellite group isn't
  // running.
  rpc AddGroupMember(AddGroupMemberRequest) returns (AddGroupMemberResponse);
  // Remove a member from the group. Every member is told, the removed one
  // too, so it forgets the group. A group left with one member ends.
  // Refused with `invalid_argument` for this satellite's own MAC or when the
  // member's entry can't change any more, `failed_precondition` when this
  // satellite is in no group or the satellite isn't a member, and
  // `unavailable` while the satellite group isn't running.
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (RemoveGroupMemberResponse);
}

// What a ListChoices request asks for.
enum ChoiceKind {
  CHOICE_KIND_UNSPECIFIED = 0;
  // The slot's model: the brain's, speech-to-text's, or the one that
  // speaks the text-to-speech voice.
  CHOICE_KIND_MODEL = 1;
  // Text-to-speech voices.
  CHOICE_KIND_VOICE = 2;
}

message ListChoicesRequest {
  AssistantSlot slot = 1;
  // One of Assistant.connections, by id.
  string connection = 2;
  ChoiceKind kind = 3;
}

message ListChoicesResponse {
  // At most 500, in the service's order or by name.
  repeated Choice choices = 1;
}

// One suggestion: what goes into the field, and what to show for it.
message Choice {
  string id = 1;
  string label = 2;
}

// The slots of a standalone request.
enum AssistantSlot {
  ASSISTANT_SLOT_UNSPECIFIED = 0;
  ASSISTANT_SLOT_STT = 1;
  ASSISTANT_SLOT_BRAIN = 2;
  ASSISTANT_SLOT_TTS = 3;
}

// Who runs the tools.
enum Delegation {
  // The preset's choice.
  DELEGATION_UNSPECIFIED = 0;
  // The satellite offers its tools and runs the ones the brain calls.
  DELEGATION_TOOL_LOOP = 1;
  // The brain is an agent with its own tools and memory: it gets the
  // request and answers it.
  DELEGATION_HAND_OFF = 2;
}

// How much of the conversation the brain gets.
enum History {
  // The preset's choice.
  HISTORY_UNSPECIFIED = 0;
  // The last `history_limit` turns, 1 to 10.
  HISTORY_TURNS = 1;
  // Up to `history_limit` bytes of text, at most 65536, oldest dropped first.
  HISTORY_BYTES = 2;
  // Only the new turn.
  HISTORY_NEW_TURN_ONLY = 3;
}

// How long a reasoning model thinks before it answers, sent as
// `reasoning_effort` to a brain on the OpenAI-compatible protocol.
enum Reasoning {
  // Nothing is sent: the service's default.
  REASONING_UNSPECIFIED = 0;
  REASONING_NONE = 1;
  REASONING_LOW = 2;
  REASONING_MEDIUM = 3;
  REASONING_HIGH = 4;
}

message Assistant {
  // All three slots are ready: standalone mode can be switched on.
  bool ready = 1;
  repeated ProviderConnection connections = 2;
  // Each unset until chosen.
  SlotChoice stt = 3;
  SlotChoice brain = 4;
  SlotChoice tts = 5;
  BrainOverride brain_override = 6;
  // A BCP 47 tag such as de or en-US; empty when unset.
  string language = 7;
  // For the weather and the brain's context; unset when none is set.
  Place place = 8;
  // The owner's prompt. Unset means the satellite's voice rules; empty
  // means the context only.
  optional string prompt = 9;
  // Listen for a follow-up after every reply.
  bool follow_ups = 10;
  Acknowledgment ack = 11;
  // Per-tool switches, for the brain and MCP clients alike; a tool without
  // an entry is on, unless its DeviceTool.off_by_default is set.
  map<string, bool> tools = 12;
  repeated Station stations = 13;
  repeated McpServer mcp_servers = 14;
  // MCP clients that called this satellite's /mcp since pinnad started, the
  // most recent first; at most 8.
  repeated McpAgent agents = 15;
  // The presets a connection can use, in the order to offer them.
  repeated Preset presets = 16;
  // What the satellite says while a slow agent thinks, in the current
  // language: the owner's phrase, or while the owner keeps the default, the
  // language's own.
  string ack_spoken = 17;
  // The satellite's voice rules: the prompt while `prompt` is unset, and
  // what going back to them restores.
  string voice_rules = 18;
  // The satellite's own tools, which `tools` switches, in the order to show
  // them.
  repeated DeviceTool device_tools = 19;
  // Names the prompt as it is now (the owner's text or the voice rules). An
  // edit sends the one it started from (UpdateAssistantRequest).
  string prompt_revision = 20;
}

// A provider's address and key, shared by the slots that use it.
message ProviderConnection {
  string id = 1;
  // One of Assistant.presets, by id.
  string preset = 2;
  string base_url = 3;
  // Goes up when the address or the key changes; edits name the revision
  // they were made on.
  uint64 revision = 4;
  // A key is stored for this address. The key itself is never returned.
  bool key_set = 5;
  // The key's last four characters, to tell keys apart; empty without one.
  string key_last4 = 6;
}

// A slot's connection and its model, or for text-to-speech its voice.
message SlotChoice {
  string connection = 1;
  string model = 2;
  // It passed its check at the connection's current revision.
  bool ready = 3;
  // Text-to-speech only: the model that speaks the voice; empty is the
  // preset's (Preset.tts_model).
  string speech_model = 4;
}

// The brain's Advanced settings. Each one unset keeps the preset's.
message BrainOverride {
  Delegation delegation = 1;
  History history = 2;
  // The turns or bytes of HISTORY_TURNS and HISTORY_BYTES.
  uint32 history_limit = 3;
  // How long the brain may take to its first text, 1 to 300 seconds.
  optional uint32 first_text_seconds = 4;
  // Only a preset with `thinking` sends it.
  Reasoning reasoning = 5;
}

message Place {
  string name = 1;
  double latitude = 2;
  double longitude = 3;
  // Its IANA time zone, such as "Europe/Berlin", when the search knew it.
  string time_zone = 4;
}

// What a slow agent says while it thinks.
message Acknowledgment {
  bool enabled = 1;
  // At most 100 characters.
  string phrase = 2;
}

// A radio station the owner added.
message Station {
  string name = 1;
  string url = 2;
}

// An MCP server the brain may call tools on, as <name>_<tool>.
message McpServer {
  string id = 1;
  // 1 to 24 lowercase letters, digits and hyphens.
  string name = 2;
  // The host, and the port when it has one. The address may carry a token,
  // so it is never returned.
  string host = 3;
  bool enabled = 4;
  // Goes up with every change; edits name the revision they were made on.
  uint64 revision = 5;
  // How many tools it listed when last asked; 0 with `problem`, or before it
  // was asked.
  uint32 tools = 6;
  // Why it couldn't be listed when last asked, as one sentence; empty when it
  // worked or wasn't asked. A saved server is asked at once; the brain asks
  // again before a request.
  string problem = 7;
  // The tools it listed when last asked, by the name the brain calls them
  // (`<name>_<tool>`), which is also the name of their switch in
  // Assistant.tools.
  repeated McpServerTool listed = 8;
  // The credential sent with every request to it, without its secret;
  // unset without one.
  McpServerCredential credential = 9;
}

// What tells a stored credential apart. The token, password or value itself
// is never returned.
message McpServerCredential {
  McpCredentialKind kind = 1;
  // The user name, or the header's name; empty for a token.
  string label = 2;
  // The last four characters of a token or a header's value of 16 or more;
  // empty for a shorter one, which they would mostly give away, and for a
  // password.
  string last4 = 3;
}

enum McpCredentialKind {
  MCP_CREDENTIAL_KIND_UNSPECIFIED = 0;
  // Sent as `Authorization: Bearer <token>`.
  MCP_CREDENTIAL_KIND_BEARER = 1;
  // A user name and password, sent as `Authorization: Basic`.
  MCP_CREDENTIAL_KIND_BASIC = 2;
  // A header the owner names, such as `X-API-Key`.
  MCP_CREDENTIAL_KIND_HEADER = 3;
}

// A credential as the owner types it.
message McpCredential {
  oneof kind {
    McpBearer bearer = 1;
    McpBasic basic = 2;
    McpHeader header = 3;
  }
}

message McpBearer {
  string token = 1;
}

message McpBasic {
  string user = 1;
  string password = 2;
}

message McpHeader {
  string name = 1;
  string value = 2;
}

message McpServerTool {
  string name = 1;
  // As the server describes it.
  string description = 2;
}

// An MCP client that called this satellite's /mcp.
message McpAgent {
  // The name the client gave, at most 40 characters.
  string name = 1;
  // The address it called from.
  string address = 2;
  // When it last called, in milliseconds since the Unix epoch.
  uint64 last_seen_unix_ms = 3;
}

// A provider preset: the address and defaults a connection starts from.
message Preset {
  // Such as "openai" or "ollama".
  string id = 1;
  // The address it fills in. The owner enters what `<host>` and `<port>`
  // stand for, or for an empty one the whole address.
  string base_url = 2;
  // The slots it can serve.
  bool stt = 3;
  bool brain = 4;
  bool tts = 5;
  // The brain model it always uses; empty when the owner chooses one.
  string model = 6;
  // Its brain is an agent (DELEGATION_HAND_OFF).
  bool hand_off = 7;
  // Its brain takes BrainOverride.reasoning (the OpenAI-compatible protocol).
  bool thinking = 8;
  // The text-to-speech model it uses while the slot names none; empty
  // without text-to-speech.
  string tts_model = 9;
}

// One of the satellite's own tools.
message DeviceTool {
  // As the brain and MCP clients call it, such as "set_timer".
  string name = 1;
  // What it does, as the owner reads it beside its switch.
  string description = 2;
  // The brain's tool loop offers it.
  bool brain = 3;
  // Pinna's MCP server offers it.
  bool mcp = 4;
  // It is off until the owner turns it on: a tool without an entry in
  // Assistant.tools is on only when this is false.
  bool off_by_default = 5;
}

message GetAssistantRequest {}

message GetAssistantResponse {
  Assistant assistant = 1;
}

message SetConnectionRequest {
  // Empty adds a connection.
  string id = 1;
  // The revision the edit was made on; ignored when adding.
  uint64 revision = 2;
  // One of Assistant.presets, by id.
  string preset = 3;
  // Empty for the preset's address. For a server on the network, its host
  // is enough: the preset adds the port and path.
  string base_url = 4;
  // A key typed for this address. Unset keeps the stored key, unless the
  // address changes: a key belongs to the address it was typed for.
  optional string key = 5;
  // Remove the key; refused together with `key`.
  bool clear_key = 6;
}

message SetConnectionResponse {
  Assistant assistant = 1;
}

message DeleteConnectionRequest {
  string id = 1;
  uint64 revision = 2;
}

message DeleteConnectionResponse {
  Assistant assistant = 1;
}

message SetSlotRequest {
  AssistantSlot slot = 1;
  // A connection whose preset serves the slot.
  string connection = 2;
  // The model, or for text-to-speech the voice. Empty for a preset with a
  // fixed brain model.
  string model = 3;
  // Text-to-speech only: the model that speaks the voice; empty is the
  // preset's. Checked with the voice.
  string speech_model = 4;
}

message SetSlotResponse {
  Assistant assistant = 1;
}

// Each field unset leaves its setting as it is.
message UpdateAssistantRequest {
  // A BCP 47 tag; empty clears it.
  optional string language = 1;
  // At most 4,000 characters; empty keeps only the context.
  optional string prompt = 2;
  // Go back to the voice rules; refused together with `prompt`.
  bool default_prompt = 3;
  optional bool follow_ups = 4;
  Acknowledgment ack = 5;
  // Replaces every switch.
  ToolSwitches tools = 6;
  // Replaces every Advanced setting.
  BrainOverride brain_override = 7;
  // A place name to look up, such as a town; empty clears it.
  optional string place = 8;
  // Replaces every station.
  StationList stations = 9;
  // With `prompt` or `default_prompt`: the Assistant.prompt_revision the
  // edit started from. If the prompt changed since (another window), the
  // edit is refused with `aborted`. Empty doesn't check.
  string prompt_revision = 10;
}

message StationList {
  repeated Station stations = 1;
}

message ToolSwitches {
  // Tool name to on or off.
  map<string, bool> on = 1;
}

message UpdateAssistantResponse {
  Assistant assistant = 1;
}

message SetMcpServerRequest {
  // Empty adds a server.
  string id = 1;
  // The revision the edit was made on; ignored when adding.
  uint64 revision = 2;
  string name = 3;
  // The whole address, with any token it carries. Unset keeps the stored
  // one; needed when adding.
  optional string url = 4;
  bool enabled = 5;
  // A credential typed for this address. Unset keeps the stored one, unless
  // the address changes: a credential belongs to the address it was typed
  // for.
  McpCredential credential = 6;
  // Remove the credential; refused together with `credential`.
  bool clear_credential = 7;
}

message SetMcpServerResponse {
  Assistant assistant = 1;
}

message DeleteMcpServerRequest {
  string id = 1;
  uint64 revision = 2;
}

message DeleteMcpServerResponse {
  Assistant assistant = 1;
}

message PlaySampleRequest {
  // At most 500 characters.
  string text = 1;
}

message PlaySampleResponse {}

message AskTextRequest {
  string text = 1;
}

message AskTextResponse {}

message GetSatelliteGroupRequest {}

message GetSatelliteGroupResponse {
  SatelliteGroupView group = 1;
}

// Each field unset leaves its switch as it is.
message SetSatelliteGroupRequest {
  // Satellite group. Off leaves the group.
  optional bool on = 1;
  // Control from the group: the other members may run this satellite's
  // device tools.
  optional bool control = 2;
}

message SetSatelliteGroupResponse {
  SatelliteGroupView group = 1;
}

message AddGroupMemberRequest {
  // The satellite's MAC, as SatelliteGroupCandidate.satellite has it.
  string mac = 1;
}

message AddGroupMemberResponse {
  SatelliteGroupView group = 1;
}

message RemoveGroupMemberRequest {
  // The member's MAC, as SatelliteGroupMember has it. Not this satellite's:
  // it leaves by switching Satellite group off.
  string mac = 1;
}

message RemoveGroupMemberResponse {
  SatelliteGroupView group = 1;
}

// The satellite group as the dashboard's Satellite group page shows it.
message SatelliteGroupView {
  // The Satellite group switch.
  bool on = 1;
  // This satellite is in a group.
  bool in_group = 2;
  // The Control from the group switch.
  bool control = 3;
  // The group's members, this satellite included, by name. Empty in no
  // group.
  repeated SatelliteGroupMember members = 4;
  // The other satellites the search found (ADR 0021), except the members of
  // this group. A member counts as outside the group only when its record
  // doesn't name this group and it refused this satellite's call as not in
  // this group after the latest search, since a record can be older than
  // the member's Add. Such a member is in both lists: here, and in
  // `members`. It is STATE_IN_ANOTHER_GROUP when its record names another
  // group, and STATE_LEFT_THE_GROUP otherwise. Empty while the switch is
  // off.
  repeated SatelliteGroupCandidate candidates = 5;
}

// A member of this satellite's group.
message SatelliteGroupMember {
  // In lowercase colon form.
  string mac = 1;
  // The last friendly name the search heard; this satellite's own name for
  // itself.
  string name = 2;
  // This satellite.
  bool this_satellite = 3;
  // Its mode, from its last signed answer. Unset until one arrived, and
  // for this satellite.
  optional Mode mode = 4;
  // When it last answered the search or a call, in milliseconds since the
  // Unix epoch; 0 when it hasn't since pinnad started, and for this
  // satellite. Kept in memory only.
  uint64 last_seen_unix_ms = 5;
  // It has a dashboard password, from its last signed call or answer (ADR
  // 0029). Unset until one arrived, and for this satellite.
  optional bool has_password = 6;
}

// A satellite the search found, other than a member still in this group.
message SatelliteGroupCandidate {
  // As the search found it: its MAC, friendly name, host and addresses, for
  // the link to its dashboard.
  Satellite satellite = 1;

  enum State {
    STATE_UNSPECIFIED = 0;
    // Its Satellite group switch is on and it is in no group.
    STATE_ADDABLE = 1;
    // It is in another group. A member of this group that refused this
    // satellite's call as not in this group is listed in `members` too.
    STATE_IN_ANOTHER_GROUP = 2;
    // Satellite group is off there, or its Pinna is older.
    STATE_OFF_OR_OLDER = 3;
    // A member of this group whose record says it is in no group, and that
    // refused this satellite's call as not in this group: its switch was
    // turned off, or it was reset. It is listed in `members` too.
    STATE_LEFT_THE_GROUP = 4;
  }
  State state = 2;
  // Add is offered: its switch is on and it is in no group. Its name may
  // still refuse it (`name_refusal`).
  bool addable = 3;
  // Its friendly name is still the one Pinna gave it, which is hard to say.
  // It can be added all the same.
  bool default_name = 4;
  // Why Add would be refused for its name, as one sentence; empty when the
  // name can be added, and when Add isn't offered.
  string name_refusal = 5;
}

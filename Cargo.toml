[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
ed25519-dalek = "2"
libc = "0.2"
crc32fast = "1"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

# tract-tflite 0.22.5 with fixes for openWakeWord's .tflite classifiers (ADR 0013).
[patch.crates-io]
tract-tflite = { path = "vendor/tract-tflite" }

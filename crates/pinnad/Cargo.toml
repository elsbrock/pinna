[package]
name = "pinnad"
description = "Pinna device daemon: LEDs, buttons, wake word and Home Assistant voice satellite"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
pinna-esphome = { path = "../pinna-esphome" }
pinna-hal = { path = "../pinna-hal" }
pinna-audio = { path = "../pinna-audio" }
pinna-wakeword = { path = "../pinna-wakeword" }
pinna-bootctl = { path = "../pinna-bootctl" }
pinna-image = { path = "../pinna-image" }
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64 = "0.23.1"
bytes = "1"
fastrand = "2"
pinna-api = { path = "../pinna-api" }
connectrpc = { version = "0.9.1", default-features = false, features = ["json", "gzip", "server", "axum"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "ws"] }
tower-http = { version = "0.6", features = ["fs"] }
buffa = "0.9"
futures = "0.3"
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[package]
name = "pinnad"
description = "Pinna device daemon: LEDs, buttons, wake word and Home Assistant voice satellite"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
pinna-version = { path = "../pinna-version" }
pinna-assist = { path = "../pinna-assist" }
pinna-http = { path = "../pinna-http" }
pinna-vad = { path = "../pinna-vad" }
pinna-mcp = { path = "../pinna-mcp" }
pinna-esphome = { path = "../pinna-esphome" }
pinna-hal = { path = "../pinna-hal" }
pinna-audio = { path = "../pinna-audio" }
pinna-wakeword = { path = "../pinna-wakeword" }
pinna-bootctl = { path = "../pinna-bootctl" }
pinna-image = { path = "../pinna-image" }
pinna-sendspin = { path = "../pinna-sendspin" }
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64 = "0.23.1"
bytes = "1"
fastrand = "2"
pinna-api = { path = "../pinna-api" }
connectrpc = { version = "0.9.1", default-features = false, features = ["json", "gzip", "server", "axum", "client"] }
# matched-path: the dashboard password check tells a route from the file
# fallback by the route the router matched (ADR 0029).
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "ws", "matched-path"] }
tower-http = { version = "0.6", features = ["fs"] }
buffa = "0.9"
futures = "0.3"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-zoneinfo"] }
url = "2"
prometheus-client = "0.26"
procfs = { version = "0.18", default-features = false }
simple-dns = "0.13"
# HMAC-SHA256 and secure random numbers for the satellite group (ADR 0026):
# already in the build under rustls, which doesn't expose them.
ring = "0.17"

# musl's malloc grows pinnad until the satellite runs out of memory; see the
# global allocator in main.rs.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
pinna-assist = { path = "../pinna-assist", features = ["testing"] }
pinna-esphome = { path = "../pinna-esphome", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
# A Sendspin server for the session tests (ADR 0027): both already in the build,
# under pinna-sendspin and axum.
snow = "0.10.0"
tokio-tungstenite = "0.29"

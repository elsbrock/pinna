[package]
name = "pinna-audio"
description = "Audio capture and playback for Pinna via alsa-utils / PipeWire subprocesses"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "1"
hound = "3"
libc.workspace = true
memmap2 = "0.9"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "process", "io-util", "fs"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
tracing-subscriber.workspace = true

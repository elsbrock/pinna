[package]
name = "pinna-wakeword"
description = "On-device wake word detection: openWakeWord models (ONNX or TFLite) on tract"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
pinna-vad = { path = "../pinna-vad" }
tract-onnx = "0.22"
tract-tflite = "0.22"

[dev-dependencies]
# The version tract-tflite builds with, for the TFLite fixture in tests/upload.rs.
flatbuffers = "23.1.21"
hound = "3"
pinna-audio = { path = "../pinna-audio" }
serde_json = "1"
prost = "0.11"

[package]
name = "pinna-assist"
description = "One standalone voice request, without device state"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[features]
testing = ["dep:axum"]

[dependencies]
axum = { version = "0.8", optional = true }
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
pinna-http = { path = "../pinna-http" }
pinna-mcp = { path = "../pinna-mcp" }
pinna-vad = { path = "../pinna-vad" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
toml.workspace = true
url = "2"

[dev-dependencies]
axum = "0.8"
hound = "3"
tokio = { workspace = true, features = ["test-util"] }

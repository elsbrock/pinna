[package]
name = "pinnactl"
description = "Console client for pinnad's local control API, and the A/B updater"
edition.workspace = true
license.workspace = true
version.workspace = true
rust-version.workspace = true

[dependencies]
pinna-version = { path = "../pinna-version" }
pinna-api = { path = "../pinna-api" }
pinna-bootctl = { path = "../pinna-bootctl" }
pinna-hal = { path = "../pinna-hal" }
pinna-update = { path = "../pinna-update" }
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
connectrpc = { version = "0.9.1", default-features = false, features = ["json", "gzip", "client"] }
serde_json = "1"

[dev-dependencies]
connectrpc = { version = "0.9.1", default-features = false, features = ["json", "gzip", "client", "server"] }
buffa = "0.9"
futures = "0.3"

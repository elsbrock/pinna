name = "pinna-updates"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# Only updates.getpinna.dev: no workers.dev address, no preview URLs.
workers_dev = false
preview_urls = false
routes = [{ pattern = "updates.getpinna.dev", custom_domain = true }]

# Workers Logs and metrics, to see what the service answers. A request's log
# holds the address it came from; Cloudflare keeps the logs for a few days.
[observability]
enabled = true

[vars]
GITHUB_REPO = "elsbrock/pinna"
# GITHUB_TOKEN is a secret: npx wrangler secret put GITHUB_TOKEN

# One data point per counted update check (ADR 0039): codename, version,
# channel and country. Cloudflare creates the dataset on the first write.
[[analytics_engine_datasets]]
binding = "CHECKS"
dataset = "pinna_checks"
# CF_ACCOUNT_ID and CF_ANALYTICS_TOKEN are secrets, read by /v1/statistics:
# npx wrangler secret put CF_ACCOUNT_ID

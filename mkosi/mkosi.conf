# Pinna root filesystem: Debian trixie (armhf), read-only erofs.
#
# Build with `just image` (device, armhf) or `just image-x86` (x86_64 VM smoke
# tests), which call scripts/build-root.sh: it sets ImageVersion= (written to
# IMAGE_VERSION in os-release) and seals the erofs root into a signed slot
# image, build/pinna.root.img / build/pinna-x86.root.img (see ADR 0003).
# mkosi's own outputs (mkosi.output/):
#   pinna.root-arm.raw        the erofs root (input to the seal step)
#   pinna-x86.root-x86-64.raw the same for x86_64
#   pinna.raw, pinna-x86.raw  a GPT disk holding just that root (unused; the
#                             VM tests assemble their own disk)
#
# Architecture-specific and owner-local inputs (kernel .deb, firmware, Rust
# binaries, models, credentials) are assembled into ../build/rootfs-extra[-x86]
# and wired in by mkosi.conf.d/.

[Distribution]
Distribution=debian
Release=trixie
Architecture=arm
Repositories=main

[Output]
ImageId=pinna
# Fixed name: ImageVersion= would otherwise be appended to it.
Output=pinna
Format=disk
SplitArtifacts=partitions
OutputDirectory=mkosi.output

[Content]
Bootable=no
Locale=C.UTF-8
Timezone=Europe/Berlin
WithDocs=no
CleanPackageMetadata=yes
# Host keys are generated per device on first boot (into /var).
RemoveFiles=/etc/ssh/ssh_host_*
        # Translations: the device speaks C.UTF-8 only (33 MB).
        /usr/share/locale
        # PipeWire's FireWire (FFADO) and ROC network audio modules, and the libraries
        # only they link: the device uses neither (7 MB).
        /usr/lib/*/pipewire-0.3/libpipewire-module-ffado-driver.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-roc-*.so
        /usr/lib/*/libffado.so*
        /usr/lib/*/libroc.so*
        /usr/lib/*/libglibmm*-2.4.so*
        /usr/lib/*/libgiomm-2.4.so*
        /usr/lib/*/libxml++-2.6.so*
        /usr/lib/*/libxml2.so*
        /usr/lib/*/libsigc-2.0.so*
        /usr/share/libffado2
        /usr/lib/udev/rules.d/60-ffado.rules
Packages=
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        libnss-resolve
        libnss-myhostname
        udev
        dbus-broker
        kmod
        e2fsprogs
        iproute2
        iputils-ping
        login
        openssh-server
        wpasupplicant
        iw
        wireless-regdb
        alsa-utils
        evtest
        procps
        less
        vim-tiny
        curl
        ca-certificates
        pipewire
        pipewire-bin
        wireplumber
        # AirPlay 1 from trixie, run by pinna-airplay.service (ADR 0011).
        shairport-sync

[Build]
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
# The tools tree is bootstrapped with the host's apt; on NixOS the Debian keyring
# comes from the dev shell (staged into mkosi.sandbox by `just image`).
ToolsTreeSandboxTrees=mkosi.sandbox
CacheDirectory=mkosi.cache
Incremental=yes

# Pinna root filesystem: Debian trixie (armhf), read-only erofs.
#
# Build with `just image` (device, armhf) or `just image-x86` (x86_64 VM smoke
# tests), which call scripts/build-root.sh: it sets ImageVersion= (written to
# IMAGE_VERSION in os-release) and seals the erofs root into a signed slot
# image, build/pinna.root.img / build/pinna-x86.root.img (see ADR 0003).
# mkosi's own outputs (mkosi.output/):
#   pinna.root-arm.raw        the erofs root (input to the seal step)
#   pinna-x86.root-x86-64.raw the same for x86_64
#   pinna.raw, pinna-x86.raw  a GPT disk holding just that root (unused; the
#                             VM tests assemble their own disk)
#
# Architecture-specific and owner-local inputs (kernel .deb, firmware, Rust
# binaries, models, credentials) are assembled into ../build/rootfs-extra[-x86]
# and wired in by mkosi.conf.d/.

[Distribution]
Distribution=debian
Release=trixie
Architecture=arm
Repositories=main

[Output]
ImageId=pinna
# Fixed name: ImageVersion= would otherwise be appended to it.
Output=pinna
Format=disk
SplitArtifacts=partitions
OutputDirectory=mkosi.output

[Content]
Bootable=no
Locale=C.UTF-8
WithDocs=no
CleanPackageMetadata=yes
# Host keys are generated per device on first boot (into /var).
RemoveFiles=/etc/ssh/ssh_host_*
        # Translations: the device speaks C.UTF-8 only (33 MB).
        /usr/share/locale
        # PipeWire's FireWire (FFADO) and ROC network audio modules, and the libraries
        # only they link: the device uses neither (7 MB).
        /usr/lib/*/pipewire-0.3/libpipewire-module-ffado-driver.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-roc-*.so
        /usr/lib/*/libffado.so*
        /usr/lib/*/libroc.so*
        /usr/lib/*/libglibmm*-2.4.so*
        /usr/lib/*/libgiomm-2.4.so*
        /usr/lib/*/libxml++-2.6.so*
        /usr/lib/*/libxml2.so*
        /usr/lib/*/libsigc-2.0.so*
        /usr/share/libffado2
        /usr/lib/udev/rules.d/60-ffado.rules
        # PipeWire's JACK, PulseAudio server and network streaming modules, and the
        # JACK server libraries that nothing else links. Pinna's graphs load none of
        # them; Debian's pipewire.conf loads jackdbus-detect only if it exists.
        # libjack and libpulse stay: shairport-sync links them (1.1 MB).
        /usr/lib/*/pipewire-0.3/libpipewire-module-avb.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-jack-tunnel.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-jackdbus-detect.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-netjack2-*.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-protocol-pulse.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-pulse-tunnel.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-raop-*.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-rtp-*.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-snapcast-discover.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-vban-*.so
        /usr/lib/*/pipewire-0.3/libpipewire-module-zeroconf-discover.so
        /usr/lib/*/libjackserver.so*
        /usr/lib/*/libjacknet.so*
        # alsa-utils' test, loopback, topology and UCM tools, which nothing runs, the
        # topology library, and libsamplerate, which only alsaloop and libjacknet
        # link (1.6 MB).
        /usr/bin/alsabat
        /usr/sbin/alsabat-test
        /usr/bin/alsaloop
        /usr/bin/alsatplg
        /usr/bin/alsaucm
        /usr/bin/axfer
        /usr/lib/*/libatopology.so*
        /usr/lib/*/alsa-topology
        /usr/lib/*/libsamplerate.so*
        # The openssl command, used only for debugging over SSH. libssl stays (0.4 MB).
        /usr/bin/openssl
        # debconf's cache: only package scripts read it, and none run on the
        # read-only image (0.6 MB).
        /var/cache/debconf/*.dat*
        # The X11 locale tables libX11 never reads (1.1 MB).
        /usr/share/X11/locale
        # alsa-utils' speaker-test samples and libmysofa's HRTF data. The graphs
        # load no SOFA file (1.2 MB each).
        /usr/share/sounds/alsa
        /usr/share/libmysofa
        # Perl is there for dpkg's, debconf's and adduser's scripts, which never run
        # on the read-only image: the dpkg database is gone (CleanPackageMetadata=)
        # and no unit, udev rule or Pinna binary starts perl (9 MB).
        /usr/bin/perl
        /usr/bin/perl5*
        /usr/lib/*/perl-base
        /usr/lib/*/perl5
        /usr/share/perl5
Packages=
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        tzdata
        libnss-resolve
        libnss-myhostname
        udev
        dbus-broker
        kmod
        e2fsprogs
        iproute2
        iputils-ping
        login
        openssh-server
        wpasupplicant
        iw
        # The setup hotspot, run by pinna-hotspot.service (ADR 0028).
        hostapd
        wireless-regdb
        alsa-utils
        procps
        less
        curl
        ca-certificates
        pipewire
        pipewire-bin
        wireplumber
        # AirPlay 1 from trixie, run by pinna-airplay.service (ADR 0011).
        shairport-sync

[Build]
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
# The tools tree is bootstrapped with the host's apt; on NixOS the Debian keyring
# comes from the dev shell (staged into mkosi.sandbox by `just image`).
ToolsTreeSandboxTrees=mkosi.sandbox
CacheDirectory=mkosi.cache
Incremental=yes
# systemd-repart passes these to mkfs.erofs for the root (mkosi.repart/10-root.conf).
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-C65536

# Pinna root filesystem: Debian trixie (armhf), read-only erofs.
#
# Build with `just image`. Outputs (mkosi.output/):
#   pinna.raw                 GPT disk: misc + system_a (erofs root) + userdata — used for QEMU
#   pinna.root-arm.raw        the erofs root alone — flashed to system_a on the device
#
# Device-specific and owner-local inputs (kernel .deb, firmware, Rust binaries,
# models, credentials) are assembled into ../build/rootfs-extra by `just image`.

[Distribution]
Distribution=debian
Release=trixie
Architecture=arm
Repositories=main

[Output]
ImageId=pinna
Format=disk
SplitArtifacts=partitions
OutputDirectory=mkosi.output

[Content]
Bootable=no
Hostname=pinna
Locale=C.UTF-8
Timezone=Europe/Berlin
WithDocs=no
CleanPackageMetadata=yes
PackageDirectories=../build/debs
ExtraTrees=../build/rootfs-extra
# Host keys are generated per device on first boot (into /var).
RemoveFiles=/etc/ssh/ssh_host_*
Packages=
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        libnss-resolve
        libnss-myhostname
        udev
        dbus-broker
        kmod
        e2fsprogs
        iproute2
        iputils-ping
        openssh-server
        wpasupplicant
        wireless-regdb
        alsa-utils
        i2c-tools
        evtest
        procps
        less
        vim-tiny
        curl
        ca-certificates
        pipewire
        pipewire-bin
        wireplumber
        linux-image-6.1.178-pinna

[Build]
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
# The tools tree is bootstrapped with the host's apt; on NixOS the Debian keyring
# comes from the dev shell (staged into mkosi.sandbox by `just image`).
ToolsTreeSandboxTrees=mkosi.sandbox
CacheDirectory=mkosi.cache
Incremental=yes

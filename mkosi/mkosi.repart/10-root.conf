# The read-only root, as erofs. scripts/build-root.sh seals it into a slot
# image (footer + dm-verity hash tree) that goes into system_a / system_b;
# pinna-init mounts it through dm-verity. The VM tests assemble their own disk
# (misc, expdb, system_a, system_b, userdata), so this is the only partition.
[Partition]
Type=root
Label=system_a
Format=erofs
Compression=lz4hc
CopyFiles=/
Minimize=best

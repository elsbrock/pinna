# The read-only root, as erofs. scripts/build-root.sh seals it into a slot
# image (footer + dm-verity hash tree) that goes into system_a / system_b;
# pinna-init mounts it through dm-verity. The VM tests assemble their own disk
# (misc, expdb, system_a, system_b, userdata), so this is the only partition.
[Partition]
Type=root
Label=system_a
Format=erofs
# lz4hc at its top level, in 64 KiB physical clusters (-C65536, from
# SYSTEMD_REPART_MKFS_OPTIONS_EROFS in mkosi.conf): the same lz4 decompressor,
# which every Pinna kernel has, and 12 MiB less root than the default level
# with 4 KiB clusters (0.6.0-dev root, 192 MB of files: 110 to 98 MiB). The
# Echo Dot (5th gen)'s 125 MiB system slot is the tightest (ADR 0035).
Compression=lz4hc
CompressionLevel=12
CopyFiles=/
Minimize=best

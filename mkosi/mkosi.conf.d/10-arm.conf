# The Echo: our MT8163 kernel package and the device extra tree.
[Match]
Architecture=arm

[Content]
PackageDirectories=../build/debs
# The boot image carries the kernel; the package's copy in /boot is unused
# (ADR 0035) and costs the root 4.7 MB.
RemoveFiles=/boot/vmlinuz-*
        /boot/System.map-*
        /boot/config-*
        # BlueZ's debugging and old test tools, used only over SSH; mpris-proxy goes
        # with the user unit that starts it in every login (0.6 MB).
        /usr/bin/btmon
        /usr/bin/gatttool
        /usr/bin/mpris-proxy
        /usr/bin/obexctl
        /usr/bin/sdptool
        /usr/lib/systemd/user/mpris-proxy.service
        /etc/systemd/user/default.target.wants/mpris-proxy.service
ExtraTrees=../build/rootfs-extra
Packages=linux-image-6.12.117-pinna
        # Bluetooth playback, started by pinnad with pinna-bluetooth.target (ADR 0011).
        bluez
        bluez-alsa-utils

# The Echo: our MT8163 kernel package and the device extra tree.
[Match]
Architecture=arm

[Content]
PackageDirectories=../build/debs
# The boot image carries the kernel; the package's copy in /boot is unused
# (ADR 0034) and costs the root 4.7 MB.
RemoveFiles=/boot/vmlinuz-*
        /boot/System.map-*
        /boot/config-*
ExtraTrees=../build/rootfs-extra
Packages=linux-image-6.12.117-pinna
        # Bluetooth playback, started by pinnad with pinna-bluetooth.target (ADR 0011).
        bluez
        bluez-alsa-utils

# The virtual Echo Dot's audio graph (ADR 0014), x86_64 image only
# (pinna-pipewire.service runs `pipewire -c pipewire-vm.conf`). Drop-ins for
# the device's graph live in pipewire.conf.d and are not loaded here.
#
#   browser microphone -> pinnad (/virtual-device) -> pw-play -> dev_mic_in
#     -> loopback -> dev_mic   <- pinnad records this by name (a loopback is a
#                                filter to WirePlumber, never the default source)
#   pinnad plays -> dev_speaker (default sink)
#     -> monitor -> pw-record -> pinnad (/virtual-device) -> browser
#
# With no browser connected, dev_mic carries silence on the graph's clock.

context.properties = {
    core.daemon = true
    core.name   = pipewire-0
    link.max-buffers = 16
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    mem.allow-mlock = false
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-access }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-loopback
      args = {
        node.description = "Virtual Echo Dot microphone"
        audio.position   = [ MONO ]
        capture.props = {
            node.name        = "dev_mic_in"
            node.description = "Virtual Echo Dot microphone (from the browser)"
            media.class      = "Audio/Sink"
            priority.session = 1
        }
        playback.props = {
            node.name        = "dev_mic"
            node.description = "Virtual Echo Dot microphone"
            media.class      = "Audio/Source"
            priority.session = 1000
        }
      }
    }
]

context.objects = [
    # Clocks the graph when nothing else does.
    { factory = spa-node-factory
      args = {
        factory.name    = support.node.driver
        node.name       = Dummy-Driver
        node.group      = pipewire.dummy
        priority.driver = 20000
      }
    }
    { factory = spa-node-factory
      args = {
        factory.name    = support.node.driver
        node.name       = Freewheel-Driver
        priority.driver = 19000
        node.group      = pipewire.freewheel
        node.freewheel  = true
      }
    }
    { factory = adapter
      args = {
        factory.name     = support.null-audio-sink
        node.name        = "dev_speaker"
        node.description = "Virtual Echo Dot speaker"
        media.class      = "Audio/Sink"
        audio.position   = [ FL FR ]
        priority.session = 1000
      }
    }
]

# The virtual Echo Dot (ADR 0014): x86_64 image only. Runs in the VM too, with
# the virtual microphone and speaker instead of the Echo Dot's graph (which
# pipewire.conf.d holds, and pipewire-vm.conf does not load).
[Unit]
Description=PipeWire audio graph (virtual Echo Dot microphone and speaker)
ConditionFirmware=

[Service]
ExecStart=
ExecStart=/usr/bin/pipewire -c pipewire-vm.conf

[Unit]
PartOf=pinna-bluetooth.target

[Service]
# The MT8163 controller stays in setup, unseen by bluetoothd, until mgmt powers
# it once after boot (ADR 0011). bluetoothd then adds it and powers it itself.
# btmgmt sends nothing when its stdin is at EOF (/dev/null, as systemd gives
# it), so it gets one that stays open; it returns once the controller is on.
ExecStartPost=-/usr/bin/timeout 10 /bin/bash -c '/usr/bin/btmgmt --index 0 power on < <(sleep 10)'

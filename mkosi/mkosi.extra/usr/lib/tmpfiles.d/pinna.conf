# Persistent device state on /var (userdata).
d /var/lib/pinna            0755 root root -
d /var/lib/pinna/wifi       0700 root root -
# Seed the Wi-Fi config from the image default once; edits on the device win.
C- /var/lib/pinna/wifi/wpa_supplicant-wlan0.conf - - - - /usr/share/pinna/wifi/wpa_supplicant-wlan0.conf
z /var/lib/pinna/wifi/wpa_supplicant-wlan0.conf 0600 root root -
# SSH keys added on the device (release images carry none): sshd reads them
# besides /root/.ssh/authorized_keys.
d /var/lib/pinna/ssh        0700 root root -
z /var/lib/pinna/ssh/authorized_keys 0600 root root -
# Owner-local identity and Home Assistant API key, if the image carries them.
C- /var/lib/pinna/pinnad.toml   - - - - /usr/share/pinna/device/pinnad.toml
C- /var/lib/pinna/esphome-key   - - - - /usr/share/pinna/device/esphome-key
z /var/lib/pinna/esphome-key   0600 root root -
# systemd-sysext overlays (development builds via `just push`).
d /var/lib/extensions       0755 root root -

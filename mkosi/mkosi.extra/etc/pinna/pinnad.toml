# pinnad configuration (Echo Dot 2nd gen). See crates/pinnad/src/config.rs.

[device]
# ESPHome node name; empty = "pinna-" + last three MAC bytes.
name = ""
friendly_name = "Echo Dot"
model = "Echo Dot (2nd Gen)"
manufacturer = "Pinna"

[audio]
backend = "auto"          # echodot-pipewire on the device (echodot without the graph), pipewire on a laptop
volume = 50
speaker_profile = "Flat"  # biscuit; the full-size Echo uses "Radar"
wake_sound = false
# Live PCM streams into the media lane (raw s16le, 48 kHz stereo; ADR 0011).
# Empty = off.
stream_socket = "/run/pinna/stream.sock"

[wake]
enabled = true
models = "/usr/share/pinna/models/openwakeword-0.5.1"
keyword = "alexa_v0.1.onnx"
id = "alexa_v0.1"
phrase = "Alexa"
threshold = 0.55

[esphome]
port = 6053
mdns = true
# Noise encryption: base64 of 32 bytes, empty = plaintext. A key in key_file
# wins; Home Assistant can rotate the key over an encrypted connection and the
# new key is stored there.
encryption_key = ""
key_file = "/var/lib/pinna/esphome-key"

[leds]
backend = "auto"
brightness = 255

[api]
# Local control API (pinnactl, boot health check). No authentication: keep it on loopback.
listen = "127.0.0.1:7470"

[web]
# The dashboard and the same control API for your LAN (ADR 0005). No
# authentication: anyone on the network can control this satellite. Set
# listen = "" in /var/lib/pinna/pinnad.toml to turn it off.
listen = "[::]:80"
root = "/usr/share/pinna/web"
# Host names to open the dashboard by, besides IP addresses, localhost, *.local
# and the hostname (for example a name your router's DNS gives the satellite).
allowed_hosts = []

# pinnad configuration (Echo Dot and Echo, 2nd gen). See crates/pinnad/src/config.rs.

# For developers: owners set the name, the wake sound and host names on the
# dashboard (ADR 0007), which wins over this file.

[device]
# ESPHome node name; empty = "pinna-" + last three MAC bytes.
name = ""
# friendly_name and model are unset: the model and the last three MAC bytes
# ("Echo Dot 2a914e"), and the model the hardware reports.
manufacturer = "Pinna"

[audio]
backend = "auto"          # echodot-pipewire on the device (echodot without the graph), pipewire on a laptop
volume = 50
# speaker_profile is unset: Radar on the Echo (2nd gen), Flat otherwise.
wake_sound = false
# Live PCM streams into the media lane: a header line `s16le <44100|48000> 2`,
# then stereo PCM (ADR 0011). Empty = off.
stream_socket = "/run/pinna/stream.sock"

[wake]
enabled = true
models = "/usr/share/pinna/models/openwakeword-0.5.1"
keyword = "alexa_v0.1.onnx"
id = "alexa_v0.1"
phrase = "Alexa"
threshold = 0.55

[esphome]
port = 6053
mdns = true
# Noise encryption: base64 of 32 bytes. Empty: none until Home Assistant sets
# one, which is stored in key_file (ADR 0018). A key in key_file wins.
encryption_key = ""
key_file = "/var/lib/pinna/esphome-key"

[leds]
backend = "auto"
brightness = 255

[api]
# Local control API (pinnactl, boot health check). No authentication: keep it on loopback.
listen = "127.0.0.1:7470"

[web]
# The dashboard and the same control API for your LAN (ADR 0005). No
# authentication: anyone on the network can control this satellite.
# listen = "" in /var/lib/pinna/pinnad.toml turns it off.
listen = "[::]:80"
root = "/usr/share/pinna/web"
# Host names to open the dashboard by, besides IP addresses, localhost, *.local
# and the hostname. The host of the dashboard address set on the dashboard's
# Network page (ADR 0021) is added to these.
allowed_hosts = []

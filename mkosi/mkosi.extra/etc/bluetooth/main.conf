# BlueZ for Pinna (ADR 0011). pinna-bt names the adapter after the device and
# opens the pairing window; outside it, the adapter is neither discoverable
# nor pairable, and only paired phones connect.
[General]
# Audio/Video, loudspeaker: phones list it as a speaker.
Class = 0x000414
DiscoverableTimeout = 0
PairableTimeout = 0
AlwaysPairable = false

[Policy]
AutoEnable = true

# Development image: the USB serial console logs in as root. Physical access
# to the cable already implies full control (fastboot).
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -f -- \\u' --keep-baud --autologin root 115200,57600,38400,9600 - $TERM
# The logged-in shell ignores SIGTERM, and with no one reading the USB serial
# port the session doesn't end: every shutdown waited the default 90 s for it
# and then killed it, and one hung for over 7 minutes until the power was cut
# (Echo Dot (5th gen), C2N6L4, 2026-11-26). With 5 s, a restart took 8 s from
# the command to the USB disconnect.
TimeoutStopSec=5s

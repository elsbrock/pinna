# /etc is read-only: host keys live on the persistent /var and are generated
# on first boot.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'mkdir -p /var/lib/ssh && [ -s /var/lib/ssh/ssh_host_ed25519_key ] || ssh-keygen -q -t ed25519 -N "" -f /var/lib/ssh/ssh_host_ed25519_key'
ExecStartPre=/usr/sbin/sshd -t

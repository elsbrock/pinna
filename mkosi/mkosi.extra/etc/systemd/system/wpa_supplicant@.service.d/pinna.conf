# The dashboard joins networks over the control socket and saves them (ADR 0008).
[Service]
# Ready the file first: it exists, opens the control socket and allows saving.
# "-": a failure here must never keep Wi-Fi from starting.
ExecStartPre=-/usr/libexec/pinna/wifi-config /var/lib/pinna/wifi/wpa_supplicant-%I.conf
# Run on the file in /var itself, not on the /etc link: wpa_supplicant saves
# by writing a temporary file next to the path it was given, and /etc is on
# the read-only root.
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c/var/lib/pinna/wifi/wpa_supplicant-%I.conf -i%I
Restart=on-failure
RestartSec=5

# Echo Dot (2nd gen) and Echo (2nd gen) microphone graph. Runs only on the
# device (pinna-pipewire.service). ADR 0004.
#
#   dot_mics (ALSA hw:0,24, 9 lanes, 16 kHz, graph clock)
#     -> dot_wake  filter-chain (LADSPA pinna_wake): all nine lanes in; the
#                  board's microphones averaged, the echo cancelled linearly
#                  from the loopback lane the speaker plays, no suppressor;
#                  the beamformer for the ring's direction only
#                  <- pinnad records this for the wake word, Home Assistant
#                     and the standalone route
#
# pinna_wake reads the board description itself (ADR 0032), so this file
# names neither the microphones nor the reference lane.
#
# The microphone only runs at 16 kHz, so it clocks the graph, which therefore
# runs at 16 kHz. The SPI capture cannot interrupt often (minimum period 256
# frames), so the microphone is timer-driven with 40 ms of headroom absorbing
# its bursty pointer. The speaker is not in PipeWire: pinnad drives it through
# ALSA at 48 kHz (full bandwidth, and the amp sequencing stays click-free).
context.properties = {
    default.clock.rate          = 16000
    default.clock.allowed-rates = [ 16000 ]
    default.clock.quantum       = 160
    default.clock.min-quantum   = 160
    default.clock.max-quantum   = 160
}

context.objects = [
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.source
        node.name        = "dot_mics"
        node.description = "Echo Dot microphone array (raw)"
        media.class      = "Audio/Source"
        api.alsa.path    = "hw:0,24"
        api.alsa.disable-mmap   = true
        api.alsa.period-size    = 640
        api.alsa.period-num     = 4
        api.alsa.headroom       = 640
        audio.format     = "S24LE"
        audio.rate       = 16000
        audio.channels   = 9
        audio.position   = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 ]
        priority.driver  = 2000
        priority.session = 100
        session.suspend-timeout-seconds = 0
      }
    }
]

context.modules = [
    # nofail: without the plugin dot_mics still runs, and pinnad records the
    # raw lanes and averages the microphones itself (ADR 0004).
    { name = libpipewire-module-filter-chain
      flags = [ nofail ]
      args = {
        node.description = "Echo microphones"
        media.name       = "Echo microphones"
        audio.rate       = 16000
        filter.graph = {
            nodes = [
                # LADSPA default hints cannot express 12.04 dB (pinnad's x4
                # gain); Mic mask defaults to all of the board's microphones.
                { type = ladspa name = wake plugin = "/usr/lib/ladspa/pinna-beam.so" label = pinna_wake
                  control = { "Gain dB" = 12.0412 "Calibrate" = 1 } }
            ]
            inputs  = [ "wake:In 0" "wake:In 1" "wake:In 2" "wake:In 3" "wake:In 4" "wake:In 5" "wake:In 6" "wake:In 7" "wake:In 8" ]
            outputs = [ "wake:Out" ]
        }
        capture.props = {
            node.name       = "dot_wake_in"
            target.object   = "dot_mics"
            audio.channels  = 9
            audio.position  = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 ]
            stream.dont-remix = true
            node.passive    = true
        }
        playback.props = {
            node.name       = "dot_wake"
            node.description = "Echo microphones (echo-cancelled)"
            media.class     = "Audio/Source"
            audio.channels  = 1
            audio.position  = [ MONO ]
            priority.session = 2000
        }
      }
    }
]

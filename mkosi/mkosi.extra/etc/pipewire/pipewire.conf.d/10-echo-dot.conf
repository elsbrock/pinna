# Echo Dot (2nd gen) audio graph. Runs only on the device (pinna-pipewire.service).
#
#   dot_mics (ALSA hw:0,24, 9 lanes, 16 kHz, graph clock)
#     -> dot_beam   filter-chain at 16 kHz: calibration, gain, superdirective
#                   beamformer (LADSPA pinna_beam) -> mono
#     -> echo-cancel (WebRTC, mono, reference = what plays on dot_out)
#     -> dot_mic_aec  <- pinnad records this
#
#   pinnad -> dot_out (echo-cancel sink) -> dot_eq (speaker EQ) -> dot_speaker (ALSA hw:0,23)
#
# The microphone drives the graph: its SPI capture driver delivers in bursts and
# only behaves in IRQ mode, while the speaker follows with rate matching. The
# speaker never suspends, so the codec is not restarted (no clicks); pinnad
# switches the amplifier around playback.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 16000 48000 ]
    default.clock.quantum       = 1920
    default.clock.min-quantum   = 1920
    default.clock.max-quantum   = 1920
}

context.objects = [
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.sink
        node.name        = "dot_speaker"
        node.description = "Echo Dot speaker"
        media.class      = "Audio/Sink"
        api.alsa.path    = "hw:0,23"
        api.alsa.disable-mmap = true
        api.alsa.period-size  = 960
        api.alsa.period-num   = 4
        audio.format     = "S16LE"
        audio.rate       = 48000
        audio.channels   = 2
        audio.position   = [ FL FR ]
        priority.driver  = 1000
        priority.session = 100
        session.suspend-timeout-seconds = 0
      }
    }
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.source
        node.name        = "dot_mics"
        node.description = "Echo Dot microphone array (raw)"
        media.class      = "Audio/Source"
        api.alsa.path    = "hw:0,24"
        api.alsa.disable-mmap   = true
        api.alsa.disable-tsched = true
        api.alsa.period-size    = 640
        api.alsa.period-num     = 4
        audio.format     = "S24LE"
        audio.rate       = 16000
        audio.channels   = 9
        audio.position   = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 ]
        priority.driver  = 2000
        priority.session = 100
        session.suspend-timeout-seconds = 0
      }
    }
]

context.modules = [
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Echo Dot beamformer"
        media.name       = "Echo Dot beamformer"
        audio.rate       = 16000
        filter.graph = {
            nodes = [
                { type = ladspa name = beam plugin = "/usr/lib/ladspa/pinna-beam.so" label = pinna_beam }
            ]
            inputs  = [ "beam:In 0" "beam:In 1" "beam:In 2" "beam:In 3" "beam:In 4" "beam:In 5" "beam:In 6" ]
            outputs = [ "beam:Out" ]
        }
        capture.props = {
            node.name       = "dot_beam_in"
            target.object   = "dot_mics"
            audio.channels  = 7
            audio.position  = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 ]
            stream.dont-remix = true
            node.passive    = true
        }
        playback.props = {
            node.name       = "dot_beam"
            media.class     = "Audio/Source"
            audio.channels  = 1
            audio.position  = [ MONO ]
            priority.session = 500
        }
      }
    }
    { name = libpipewire-module-echo-cancel
      args = {
        library.name   = aec/libspa-aec-webrtc
        audio.rate     = 16000
        audio.channels = 1
        audio.position = [ MONO ]
        aec.args = {
            webrtc.high_pass_filter  = true
            webrtc.noise_suppression = false
            webrtc.gain_control      = false
            webrtc.voice_detection   = false
        }
        capture.props  = { node.name = "ec_capture"  target.object = "dot_beam" node.passive = true }
        source.props   = { node.name = "dot_mic_aec" node.description = "Echo Dot microphones (beamformed, echo-cancelled)" priority.session = 2000 }
        sink.props     = { node.name = "dot_out"     node.description = "Echo Dot output" priority.session = 2000 }
        playback.props = { node.name = "ec_playback" target.object = "dot_eq" node.passive = true }
      }
    }
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Echo Dot speaker EQ"
        media.name       = "Echo Dot speaker EQ"
        filter.graph = {
            nodes = [
                # The 40 mm driver cannot move air below ~150 Hz; keep that energy
                # out of it (less distortion, more headroom).
                { type = builtin name = hp_l label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
                { type = builtin name = hp_r label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
            ]
            inputs  = [ "hp_l:In" "hp_r:In" ]
            outputs = [ "hp_l:Out" "hp_r:Out" ]
        }
        audio.channels = 2
        audio.position = [ FL FR ]
        capture.props  = { node.name = "dot_eq" media.class = "Audio/Sink" priority.session = 500 }
        playback.props = { node.name = "dot_eq_out" target.object = "dot_speaker" node.passive = true }
      }
    }
]

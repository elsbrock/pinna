# Echo Dot (2nd gen) microphone graph. Runs only on the device (pinna-pipewire.service).
#
#   dot_mics (ALSA hw:0,24, 9 lanes, 16 kHz, graph clock)
#     -> dot_beam   filter-chain: calibration, gain, superdirective beamformer
#                   (LADSPA pinna_beam) -> mono
#     -> echo-cancel (WebRTC, mono) -> dot_mic_aec   <- pinnad records this
#   pinnad -> dot_ref (16 kHz mono copy of everything it plays) = echo reference
#
# The microphone only runs at 16 kHz and its SPI driver only behaves IRQ-driven,
# so it clocks the graph, which therefore runs at 16 kHz. The speaker is not in
# PipeWire: pinnad drives it through ALSA at 48 kHz (full bandwidth, and the amp
# sequencing stays click-free) and sends the speech-band reference here.
context.properties = {
    default.clock.rate          = 16000
    default.clock.allowed-rates = [ 16000 ]
    default.clock.quantum       = 640
    default.clock.min-quantum   = 640
    default.clock.max-quantum   = 640
}

context.objects = [
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.source
        node.name        = "dot_mics"
        node.description = "Echo Dot microphone array (raw)"
        media.class      = "Audio/Source"
        api.alsa.path    = "hw:0,24"
        api.alsa.disable-mmap   = true
        api.alsa.disable-tsched = true
        api.alsa.period-size    = 640
        api.alsa.period-num     = 4
        audio.format     = "S24LE"
        audio.rate       = 16000
        audio.channels   = 9
        audio.position   = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 AUX7 AUX8 ]
        priority.driver  = 2000
        priority.session = 100
        session.suspend-timeout-seconds = 0
      }
    }
    # Where the echo canceller "plays" its reference: nowhere.
    { factory = adapter
      args = {
        factory.name     = support.null-audio-sink
        node.name        = "dot_ref_sink"
        node.description = "Echo reference (discarded)"
        media.class      = "Audio/Sink"
        audio.rate       = 16000
        audio.channels   = 1
        audio.position   = [ MONO ]
        priority.driver  = 1
        priority.session = 1
      }
    }
]

context.modules = [
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Echo Dot beamformer"
        media.name       = "Echo Dot beamformer"
        audio.rate       = 16000
        filter.graph = {
            nodes = [
                # LADSPA default hints cannot express these; set them explicitly
                # (12.04 dB = pinnad's x4 gain, mask 27 = lanes 0,1,3,4).
                { type = ladspa name = beam plugin = "/usr/lib/ladspa/pinna-beam.so" label = pinna_beam
                  control = { "Gain dB" = 12.0412 "Mic mask" = 27 "Beams" = 12 "Calibrate" = 1 } }
            ]
            inputs  = [ "beam:In 0" "beam:In 1" "beam:In 2" "beam:In 3" "beam:In 4" "beam:In 5" "beam:In 6" ]
            outputs = [ "beam:Out" ]
        }
        capture.props = {
            node.name       = "dot_beam_in"
            target.object   = "dot_mics"
            audio.channels  = 7
            audio.position  = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 AUX6 ]
            stream.dont-remix = true
            node.passive    = true
        }
        playback.props = {
            node.name       = "dot_beam"
            media.class     = "Audio/Source"
            audio.channels  = 1
            audio.position  = [ MONO ]
            priority.session = 500
        }
      }
    }
    { name = libpipewire-module-echo-cancel
      args = {
        library.name   = aec/libspa-aec-webrtc
        audio.rate     = 16000
        audio.channels = 1
        audio.position = [ MONO ]
        aec.args = {
            webrtc.high_pass_filter  = true
            webrtc.noise_suppression = false
            webrtc.gain_control      = false
            webrtc.voice_detection   = false
        }
        capture.props  = { node.name = "ec_capture"  target.object = "dot_beam" node.passive = true }
        source.props   = { node.name = "dot_mic_aec" node.description = "Echo Dot microphones (beamformed, echo-cancelled)" priority.session = 2000 }
        sink.props     = { node.name = "dot_ref"     node.description = "Echo Dot echo reference (pinnad)" priority.session = 1 }
        playback.props = { node.name = "ec_playback" target.object = "dot_ref_sink" node.passive = true }
      }
    }
]

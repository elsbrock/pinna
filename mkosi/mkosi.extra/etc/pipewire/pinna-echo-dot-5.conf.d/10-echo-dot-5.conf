# Echo Dot (5th gen) microphone graph. Runs only on the device, when
# /usr/libexec/pinna/pipewire starts PipeWire as `pipewire -c
# pinna-echo-dot-5.conf` on an MT8519 (the MT8163's graph is 10-echo-dot.conf).
# ADR 0004, ADR 0035.
#
#   dot_mics (ALSA hw:0,9, 6 lanes, S32_LE, 96 kHz; PipeWire's adapter
#             resamples it to the 16 kHz graph)
#     -> dot_wake  filter-chain (LADSPA pinna_wake): all six lanes in; the
#                  board's microphones averaged, the echo cancelled linearly
#                  from the loopback lane the speaker plays, no suppressor;
#                  the beamformer for the ring's direction only
#                  <- pinnad records this for the wake word, Home Assistant
#                     and the standalone route
#
# pinna_wake reads the board description itself (ADR 0032), so this file
# names neither the microphones nor the reference lane. Lanes (TECHO5, one
# C2N6L4 under Amazon's kernel, 2026-11-22/23, discussion #610): 0-2 are the
# microphones, 3 is the converter's unwired input, 4-5 are DL2's left and
# right channel looped back. Pinna's kernel delivers the same (C2N6L4,
# 2026-11-26): microphones at -54 to -52 dBFS in a quiet room, lane 3 digital
# zero, and a -50 dBFS tone on DL2 read back at -50.0 dBFS on lanes 4 and 5.
#
# TECHO5 heard microphone 2 alone beat the three-microphone average for the
# wake word over music (it hears the speaker 6 dB less); not measured in
# Pinna's graph.
#
# Calibrate is 0: the MT8163's per-microphone factors don't apply. The gain is
# the MT8163's 12.04 dB (x4); the microphone level on this board has not been
# measured in Pinna's graph.
#
# The graph stays at 16 kHz with a 160-sample quantum, as on the MT8163 (see
# 10-echo-dot.conf). The capture runs on its own interrupts, 960 frames (10 ms
# at 96 kHz) per period, so it needs none of the MT8163's SPI timer
# workarounds. The speaker is not in PipeWire: pinnad drives it through ALSA.

context.properties = {
    default.clock.rate          = 16000
    default.clock.allowed-rates = [ 16000 ]
    default.clock.quantum       = 160
    default.clock.min-quantum   = 160
    default.clock.max-quantum   = 160
}

context.objects = [
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.source
        node.name        = "dot_mics"
        node.description = "Echo Dot (5th gen) microphone array (raw)"
        media.class      = "Audio/Source"
        api.alsa.path    = "hw:0,9"
        api.alsa.period-size    = 960
        api.alsa.period-num     = 4
        audio.format     = "S32LE"
        audio.rate       = 96000
        audio.channels   = 6
        audio.position   = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 ]
        priority.driver  = 2000
        priority.session = 100
        session.suspend-timeout-seconds = 0
      }
    }
]

context.modules = [
    # nofail: without the plugin dot_mics still runs, and pinnad records the
    # raw lanes and averages the microphones itself (ADR 0004).
    { name = libpipewire-module-filter-chain
      flags = [ nofail ]
      args = {
        node.description = "Echo microphones"
        media.name       = "Echo microphones"
        audio.rate       = 16000
        filter.graph = {
            nodes = [
                # LADSPA default hints cannot express 12.04 dB (pinnad's x4
                # gain); Mic mask defaults to all of the board's microphones.
                { type = ladspa name = wake plugin = "/usr/lib/ladspa/pinna-beam.so" label = pinna_wake
                  control = { "Gain dB" = 12.0412 "Calibrate" = 0 } }
            ]
            inputs  = [ "wake:In 0" "wake:In 1" "wake:In 2" "wake:In 3" "wake:In 4" "wake:In 5" ]
            outputs = [ "wake:Out" ]
        }
        capture.props = {
            node.name       = "dot_wake_in"
            target.object   = "dot_mics"
            audio.channels  = 6
            audio.position  = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 ]
            stream.dont-remix = true
            node.passive    = true
        }
        playback.props = {
            node.name       = "dot_wake"
            node.description = "Echo microphones (echo-cancelled)"
            media.class     = "Audio/Source"
            audio.channels  = 1
            audio.position  = [ MONO ]
            priority.session = 2000
        }
      }
    }
]

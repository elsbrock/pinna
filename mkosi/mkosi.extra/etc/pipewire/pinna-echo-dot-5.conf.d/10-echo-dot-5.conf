# Echo Dot (5th gen) microphone graph. Runs only on the device, when
# /usr/libexec/pinna/pipewire starts PipeWire as `pipewire -c
# pinna-echo-dot-5.conf` on an MT8519 (the MT8163's graph is 10-echo-dot.conf).
# NOT RUN ON A DEVICE: nothing in this file has been tried on an Echo Dot
# (5th gen) or in a PipeWire daemon.
#
#   dot_mics (ALSA hw:0,9, 6 lanes, S32_LE, 96 kHz; PipeWire's adapter
#                   resamples it to the 16 kHz graph)
#     -> dot_beam   filter-chain: gain, superdirective beamformer over the
#                   three microphones, lanes 0-2 (LADSPA pinna_beam, Array 1,
#                   the L) -> mono
#     -> echo-cancel (WebRTC, mono) -> dot_mic_aec   <- pinnad records this
#   dot_mics -> dot_wake  filter-chain (LADSPA pinna_wake): microphone 2 alone,
#                   echo cancelled linearly from loopback lane 4, no
#                   suppressor (ADR 0033)   <- pinnad's wake word detector
#   pinnad -> dot_ref (16 kHz mono copy of everything it plays) = echo reference
#
# Lanes (TECHO5, one C2N6L4 under Amazon's kernel, 2026-11-22/23, discussion
# #610): 0-2 are the microphones, 3 is digitally silent, 4-5 are the speaker's
# loopback, which leads the microphones by 0.5 ms with the same polarity. Only
# AUX0-2 (and AUX4 for the wake stream) are linked; the filter-chain feeds the
# plugins' other inputs silence, which they ignore.
#
# The wake stream uses microphone 2 alone: it hears the speaker 6 dB less than
# microphones 0 and 1, and for the wake word over music it beat the
# three-microphone average (TECHO5, same unit and dates).
#
# Calibrate is 0: the MT8163's per-microphone factors don't apply. The gains
# are the MT8163's 12.04 dB (x4); the microphone level on this board has not
# been measured in Pinna's graph.
#
# The graph stays at 16 kHz with a 160-sample quantum for the echo canceller's
# 10 ms block, as on the MT8163 (see 10-echo-dot.conf). The capture runs on
# its own interrupts, 960 frames (10 ms at 96 kHz) per period, so it needs
# none of the MT8163's SPI timer workarounds. The speaker is not in PipeWire:
# pinnad drives it through ALSA and sends the speech-band reference here.

context.properties = {
    default.clock.rate          = 16000
    default.clock.allowed-rates = [ 16000 ]
    default.clock.quantum       = 160
    default.clock.min-quantum   = 160
    default.clock.max-quantum   = 160
}

context.objects = [
    { factory = adapter
      args = {
        factory.name     = api.alsa.pcm.source
        node.name        = "dot_mics"
        node.description = "Echo Dot (5th gen) microphone array (raw)"
        media.class      = "Audio/Source"
        api.alsa.path    = "hw:0,9"
        api.alsa.period-size    = 960
        api.alsa.period-num     = 4
        audio.format     = "S32LE"
        audio.rate       = 96000
        audio.channels   = 6
        audio.position   = [ AUX0 AUX1 AUX2 AUX3 AUX4 AUX5 ]
        priority.driver  = 2000
        priority.session = 100
        session.suspend-timeout-seconds = 0
      }
    }
    # Where the echo canceller "plays" its reference: nowhere.
    { factory = adapter
      args = {
        factory.name     = support.null-audio-sink
        node.name        = "dot_ref_sink"
        node.description = "Echo reference (discarded)"
        media.class      = "Audio/Sink"
        audio.rate       = 16000
        audio.channels   = 1
        audio.position   = [ MONO ]
        priority.driver  = 1
        priority.session = 1
      }
    }
]

context.modules = [
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Echo Dot (5th gen) beamformer"
        media.name       = "Echo Dot (5th gen) beamformer"
        audio.rate       = 16000
        filter.graph = {
            nodes = [
                # LADSPA default hints cannot express these; set them explicitly
                # (12.04 dB = pinnad's x4 gain, mask 7 = lanes 0-2, Array 1 = the L).
                { type = ladspa name = beam plugin = "/usr/lib/ladspa/pinna-beam.so" label = pinna_beam
                  control = { "Gain dB" = 12.0412 "Mic mask" = 7 "Beams" = 12 "Calibrate" = 0 "Array" = 1 } }
            ]
            inputs  = [ "beam:In 0" "beam:In 1" "beam:In 2" ]
            outputs = [ "beam:Out" ]
        }
        capture.props = {
            node.name       = "dot_beam_in"
            target.object   = "dot_mics"
            audio.channels  = 3
            audio.position  = [ AUX0 AUX1 AUX2 ]
            stream.dont-remix = true
            node.passive    = true
        }
        playback.props = {
            node.name       = "dot_beam"
            media.class     = "Audio/Source"
            audio.channels  = 1
            audio.position  = [ MONO ]
            priority.session = 500
        }
      }
    }
    # The wake word's own stream (ADR 0033). WebRTC's suppressor mutes a
    # talker over playback; this linear canceller doesn't, and lane 4 carries
    # the speaker signal in the same frame as the microphones. nofail: without
    # it the rest of the graph still runs, and pinnad's detector falls back to
    # dot_mic_aec.
    { name = libpipewire-module-filter-chain
      flags = [ nofail ]
      args = {
        node.description = "Echo Dot (5th gen) wake word stream"
        media.name       = "Echo Dot (5th gen) wake word stream"
        audio.rate       = 16000
        filter.graph = {
            nodes = [
                { type = ladspa name = wake plugin = "/usr/lib/ladspa/pinna-beam.so" label = pinna_wake
                  control = { "Gain dB" = 12.0412 "Mic mask" = 4 "Calibrate" = 0 } }
            ]
            inputs  = [ "wake:In 0" "wake:In 1" "wake:In 2" "wake:Ref" ]
            outputs = [ "wake:Out" ]
        }
        capture.props = {
            node.name       = "dot_wake_in"
            target.object   = "dot_mics"
            audio.channels  = 4
            audio.position  = [ AUX0 AUX1 AUX2 AUX4 ]
            stream.dont-remix = true
            node.passive    = true
        }
        playback.props = {
            node.name       = "dot_wake"
            node.description = "Echo Dot (5th gen) wake word stream"
            media.class     = "Audio/Source"
            audio.channels  = 1
            audio.position  = [ MONO ]
            priority.session = 400
        }
      }
    }
    { name = libpipewire-module-echo-cancel
      args = {
        library.name   = aec/libspa-aec-webrtc
        audio.rate     = 16000
        audio.channels = 1
        audio.position = [ MONO ]
        aec.args = {
            webrtc.high_pass_filter  = true
            webrtc.noise_suppression = false
            webrtc.gain_control      = false
            webrtc.voice_detection   = false
        }
        capture.props  = { node.name = "ec_capture"  target.object = "dot_beam" node.passive = true }
        source.props   = { node.name = "dot_mic_aec" node.description = "Echo Dot microphones (beamformed, echo-cancelled)" priority.session = 2000 }
        sink.props     = { node.name = "dot_ref"     node.description = "Echo Dot echo reference (pinnad)" priority.session = 1 }
        playback.props = { node.name = "ec_playback" target.object = "dot_ref_sink" node.passive = true }
      }
    }
]

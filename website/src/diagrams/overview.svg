<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 628">
  <defs>
    <marker id="ov-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="tip" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <text class="h" x="0" y="14">Connects to the satellite</text>
  <text class="h" x="380" y="14" text-anchor="middle">The satellite</text>
  <text class="h" x="760" y="14" text-anchor="end">The satellite connects to</text>

  <rect class="zone" x="220" y="26" width="320" height="594" rx="14"/>

  <!-- pinnad, with what each connection reaches -->
  <rect class="box focus" x="232" y="38" width="296" height="258" rx="10"/>
  <a href="#inside-pinnad">
    <text x="246" y="59"><tspan class="t">pinnad</tspan><tspan dx="8">the voice satellite, one process</tspan></text>
  </a>

  <rect class="box" x="244" y="72" width="130" height="36" rx="6"/>
  <text class="c" x="256" y="95">ESPHome API</text>
  <rect class="box" x="244" y="116" width="130" height="36" rx="6"/>
  <text class="c" x="256" y="139">Dashboard and API</text>
  <rect class="box opt" x="244" y="160" width="130" height="36" rx="6"/>
  <text class="c" x="256" y="183">MCP server</text>
  <rect class="box" x="244" y="204" width="130" height="36" rx="6"/>
  <text class="c" x="256" y="227">Sendspin player</text>
  <rect class="box opt" x="244" y="248" width="130" height="36" rx="6"/>
  <text class="c" x="256" y="271">Group calls</text>

  <rect class="box opt" x="386" y="72" width="130" height="168" rx="6"/>
  <text class="c" x="451" y="152" text-anchor="middle">Standalone</text>
  <text class="c" x="451" y="169" text-anchor="middle">request</text>
  <rect class="box" x="386" y="248" width="130" height="36" rx="6"/>
  <text class="c" x="398" y="271">Update check</text>

  <!-- What connects in -->
  <rect class="box" x="0" y="71" width="150" height="38" rx="8"/>
  <text class="t" x="12" y="87">Home Assistant</text>
  <text x="12" y="101">Assist, entities</text>
  <path class="wire" d="M150,90 H243" marker-end="url(#ov-tip)"/>
  <text x="185" y="85" text-anchor="middle">TCP 6053</text>

  <rect class="box" x="0" y="115" width="150" height="38" rx="8"/>
  <text class="t" x="12" y="131">Web browser</text>
  <text x="12" y="145">the dashboard</text>
  <path class="wire" d="M150,134 H243" marker-end="url(#ov-tip)"/>
  <text x="185" y="129" text-anchor="middle">TCP 80</text>

  <rect class="box opt" x="0" y="159" width="150" height="38" rx="8"/>
  <text class="t" x="12" y="175">AI agent</text>
  <text x="12" y="189">an MCP client</text>
  <path class="wire opt" d="M150,178 H243" marker-end="url(#ov-tip)"/>
  <text x="185" y="173" text-anchor="middle">TCP 80</text>

  <rect class="box" x="0" y="203" width="150" height="38" rx="8"/>
  <text class="t" x="12" y="219">Music Assistant</text>
  <text x="12" y="233">a Sendspin server</text>
  <path class="wire" d="M150,222 H243" marker-end="url(#ov-tip)"/>
  <text x="185" y="217" text-anchor="middle">TCP 8928</text>

  <rect class="box opt" x="0" y="247" width="150" height="38" rx="8"/>
  <text class="t" x="12" y="263">Other satellites</text>
  <text x="12" y="277">in the same group</text>
  <path class="wire opt" d="M150,266 H243" marker-end="url(#ov-tip)"/>
  <text x="185" y="261" text-anchor="middle">TCP 80</text>

  <!-- What the satellite connects to -->
  <path class="wire opt" d="M516,90 H609" marker-end="url(#ov-tip)"/>
  <text x="575" y="85" text-anchor="middle">recording</text>
  <rect class="box opt" x="610" y="71" width="150" height="38" rx="8"/>
  <text class="t" x="622" y="87">Speech-to-text</text>
  <text x="622" y="101">a service you set up</text>

  <path class="wire opt" d="M516,134 H609" marker-end="url(#ov-tip)"/>
  <text x="575" y="129" text-anchor="middle">transcript</text>
  <rect class="box opt" x="610" y="115" width="150" height="38" rx="8"/>
  <text class="t" x="622" y="131">Brain</text>
  <text x="622" y="145">a model or an agent</text>

  <path class="wire opt" d="M516,178 H609" marker-end="url(#ov-tip)"/>
  <text x="575" y="173" text-anchor="middle">sentences</text>
  <rect class="box opt" x="610" y="159" width="150" height="38" rx="8"/>
  <text class="t" x="622" y="175">Text-to-speech</text>
  <text x="622" y="189">a service you set up</text>

  <path class="wire opt" d="M516,222 H609" marker-end="url(#ov-tip)"/>
  <text x="575" y="217" text-anchor="middle">tool calls</text>
  <rect class="box opt" x="610" y="203" width="150" height="38" rx="8"/>
  <text class="t" x="622" y="219">MCP servers</text>
  <text x="622" y="233">your own tools</text>

  <path class="wire" d="M516,266 H609" marker-end="url(#ov-tip)"/>
  <text x="575" y="261" text-anchor="middle">HTTPS</text>
  <rect class="box" x="610" y="247" width="150" height="38" rx="8"/>
  <text class="t" x="622" y="263">Update service</text>
  <text x="622" y="277">updates.getpinna.dev</text>

  <!-- Live audio and the microphones, into pinnad -->
  <rect class="box" x="0" y="330" width="150" height="38" rx="8"/>
  <text class="t" x="12" y="346">AirPlay sender</text>
  <text x="12" y="360">a phone or computer</text>
  <path class="wire" d="M150,349 H231" marker-end="url(#ov-tip)"/>
  <text x="185" y="344" text-anchor="middle">AirPlay</text>

  <rect class="box" x="0" y="374" width="150" height="38" rx="8"/>
  <text class="t" x="12" y="390">Phone</text>
  <text x="12" y="404">paired on the dashboard</text>
  <path class="wire" d="M150,393 H231" marker-end="url(#ov-tip)"/>
  <text x="185" y="388" text-anchor="middle">Bluetooth</text>

  <rect class="box" x="232" y="330" width="120" height="38" rx="8"/>
  <text class="t" x="244" y="346">pinna-airplay</text>
  <text x="244" y="360">shairport-sync</text>
  <rect class="box" x="232" y="374" width="120" height="38" rx="8"/>
  <text class="t" x="244" y="390">pinna-bt</text>
  <text x="244" y="404">BlueZ, BlueALSA</text>
  <path class="wire" d="M352,349 H372"/>
  <path class="wire" d="M352,393 H372 V297" marker-end="url(#ov-tip)"/>
  <text x="364" y="317" text-anchor="end">stream socket</text>

  <rect class="box" x="392" y="330" width="136" height="82" rx="8"/>
  <a href="/docs/audio/">
    <text class="t" x="404" y="350">PipeWire</text>
  </a>
  <text x="404" y="367">beamformer and</text>
  <text x="404" y="382">echo cancellers</text>
  <path class="wire" d="M460,330 V297" marker-end="url(#ov-tip)"/>
  <text x="468" y="317">mic audio</text>

  <!-- The layers under the programs -->
  <rect class="box" x="232" y="428" width="296" height="40" rx="8"/>
  <a href="#services">
    <text class="t" x="244" y="445">System services</text>
  </a>
  <text x="244" y="460">systemd, networkd, resolved, ssh</text>

  <rect class="box" x="232" y="474" width="296" height="40" rx="8"/>
  <a href="#storage">
    <text class="t" x="244" y="491">Root filesystem</text>
  </a>
  <text x="244" y="506">Debian, read-only and signed</text>

  <rect class="box" x="232" y="520" width="296" height="40" rx="8"/>
  <a href="#boot">
    <text class="t" x="244" y="537">Boot</text>
  </a>
  <text x="244" y="552">pinna-init, Linux 6.12, slots A and B</text>

  <rect class="box base" x="232" y="566" width="296" height="40" rx="8"/>
  <a href="#hardware">
    <text class="t" x="244" y="583">Hardware</text>
  </a>
  <text x="244" y="598">MT8163, 7 mics, speaker, ring, buttons</text>

  <rect class="box" x="0" y="567" width="150" height="38" rx="8"/>
  <text class="t" x="12" y="583">Your computer</text>
  <text x="12" y="597">flashing and rescue</text>
  <path class="wire" d="M150,586 H231" marker-end="url(#ov-tip)"/>
  <text x="185" y="581" text-anchor="middle">USB</text>

  <path class="wire opt" d="M610,349 H640"/>
  <text x="648" y="353">standalone mode only</text>
</svg>

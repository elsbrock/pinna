<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364">
  <defs>
    <marker id="au-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="tip" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- The hardware -->
  <rect class="box base" x="0" y="60" width="120" height="120" rx="8"/>
  <text class="t" x="12" y="104">Microphones</text>
  <text x="12" y="121">7 microphones,</text>
  <text x="12" y="136">speaker signal,</text>
  <text x="12" y="151">16 kHz</text>

  <rect class="box base" x="0" y="242" width="120" height="78" rx="8"/>
  <text class="t" x="12" y="276">Speaker</text>
  <text x="12" y="293">codec at 48 kHz</text>

  <!-- PipeWire: the microphones' graph -->
  <rect class="zone" x="140" y="24" width="290" height="172" rx="12"/>
  <a href="#microphones">
    <text class="t" x="152" y="46">PipeWire</text>
  </a>

  <path class="wire" d="M120,82 H161" marker-end="url(#au-tip)"/>
  <rect class="box" x="162" y="60" width="256" height="44" rx="8"/>
  <text class="t" x="174" y="78">pinna_wake</text>
  <text x="174" y="94">average, linear echo canceller</text>

  <path class="wire" d="M120,158 H161" marker-end="url(#au-tip)"/>
  <rect class="box" x="162" y="136" width="116" height="44" rx="8"/>
  <text class="t" x="174" y="154">pinna_beam</text>
  <text x="174" y="170">beamformer</text>
  <path class="wire" d="M278,158 H301" marker-end="url(#au-tip)"/>
  <rect class="box" x="302" y="136" width="116" height="44" rx="8"/>
  <text class="t" x="314" y="154">Echo canceller</text>
  <text x="314" y="170">WebRTC</text>

  <!-- pinnad: capture and playback -->
  <rect class="zone" x="450" y="24" width="310" height="332" rx="12"/>
  <a href="/docs/architecture/#inside-pinnad">
    <text class="t" x="462" y="46">pinnad</text>
  </a>

  <path class="wire" d="M418,82 H469" marker-end="url(#au-tip)"/>
  <path class="wire" d="M418,158 H469" marker-end="url(#au-tip)"/>
  <rect class="box" x="470" y="60" width="124" height="120" rx="8"/>
  <text class="t" x="482" y="114">Capture loop</text>
  <text x="482" y="131">automatic gain,</text>
  <text x="482" y="146">20 ms frames</text>

  <path class="wire" d="M594,82 H617" marker-end="url(#au-tip)"/>
  <rect class="box" x="618" y="60" width="142" height="44" rx="8"/>
  <a href="/docs/wake-words/">
    <text class="t" x="630" y="78">Wake word</text>
  </a>
  <text class="m" x="630" y="94">pinna-wakeword</text>

  <path class="wire" d="M594,158 H617" marker-end="url(#au-tip)"/>
  <rect class="box" x="618" y="130" width="142" height="56" rx="8"/>
  <text class="t" x="630" y="148">The request</text>
  <text x="630" y="164">to Home Assistant</text>
  <text x="630" y="179">or standalone</text>

  <rect class="box" x="618" y="222" width="142" height="44" rx="8"/>
  <text class="t" x="630" y="240">Voice lane</text>
  <text x="630" y="256">replies and alarms</text>
  <path class="wire" d="M618,244 H595" marker-end="url(#au-tip)"/>

  <rect class="box" x="618" y="280" width="142" height="60" rx="8"/>
  <text class="t" x="630" y="298">Media lane</text>
  <text x="630" y="314">music, AirPlay,</text>
  <text x="630" y="329">Bluetooth, Sendspin</text>
  <path class="wire" d="M618,310 H595" marker-end="url(#au-tip)"/>

  <rect class="box" x="470" y="222" width="124" height="118" rx="8"/>
  <text class="t" x="482" y="258">Mixer</text>
  <text x="482" y="275">volume, limiter;</text>
  <text x="482" y="290">media 20 dB</text>
  <text x="482" y="305">quieter for voice</text>

  <path class="wire" d="M470,281 H121" marker-end="url(#au-tip)"/>
  <text x="240" y="275" text-anchor="middle">ALSA</text>
  <circle class="tip" cx="360" cy="281" r="3"/>
  <path class="wire" d="M360,281 V181" marker-end="url(#au-tip)"/>
  <text x="368" y="236">reference copy</text>
</svg>
